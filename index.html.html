<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              850: '#172033',
              900: '#0f172a',
              950: '#090d16',
            },
            emerald: {
              450: '#10b981',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      overscroll-behavior-y: none;
    }
    /* Custom subtle scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .animate-pulse-ring {
      animation: pulseRing 2s infinite ease-in-out;
    }
  </style>
</head>

    // --- 2. APPLICATION STATE & STORAGE ENGINE ---
    const STORAGE_KEY = 'ironpulse_gym_tracker_v1';

    class GymApp {
      constructor() {
        this.state = this.loadState();
        this.currentTab = 'workout'; // 'workout' | 'routines' | 'progress' | 'history'
        this.selectedCompoundId = 'ex_bench';
        this.routineFilterMuscle = 'All';
        this.sessionInterval = null;
        this.restInterval = null;
        this.restTotalSeconds = 90;
        this.restRemainingSeconds = 0;

        this.init();
      }

      loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            // Merge any new default exercises & splits if upgrading from an earlier version
            const existingExIds = new Set((parsed.exercises || []).map(e => e.id));
            const mergedExercises = [...(parsed.exercises || [])];
            DEFAULT_EXERCISES.forEach(defEx => {
              if (!existingExIds.has(defEx.id)) {
                mergedExercises.push(defEx);
              }
            });

            const existingSplitIds = new Set((parsed.splits || []).map(s => s.id));
            const mergedSplits = [...(parsed.splits || [])];
            DEFAULT_SPLITS.forEach(defSplit => {
              if (!existingSplitIds.has(defSplit.id)) {
                mergedSplits.push(defSplit);
              }
            });

            parsed.exercises = mergedExercises;
            parsed.splits = mergedSplits;
            return parsed;
          }
        } catch (e) {
          console.error('Failed to load state:', e);
        }
        const sample = generateSampleData();
        return {
          exercises: DEFAULT_EXERCISES,
          splits: DEFAULT_SPLITS,
          activeSplitId: 'split_5day',
          selectedDayId: 'day_upper', // Next up after legs
          bodyWeights: sample.bodyWeights,
          history: sample.history,
          activeSession: null // { dayId, name, startTime, exercises: [{ exerciseId, sets: [{ weight, reps, rpe, done }] }] }
        };
      }

      saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
        } catch (e) {
          console.error('Failed to save state:', e);
        }
      }

      init() {
        this.renderNavigation();
        this.renderCurrentView();
        if (this.state.activeSession) {
          this.startSessionTicker();
        }
      }

      // --- AUDIO BEEP FOR REST TIMER ---
      playAlertSound() {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          const ctx = new AudioCtx();
          const playBeep = (delay, freq) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
            gain.gain.setValueAtTime(0.25, ctx.currentTime + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + delay);
            osc.stop(ctx.currentTime + delay + 0.26);
          };
          playBeep(0, 880);
          playBeep(0.3, 1174.66);
        } catch (e) {
          // Audio blocked or unsupported
        }
      }

      showToast(msg) {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-message');
        toastMsg.textContent = msg;
        toast.classList.remove('opacity-0', 'translate-y-[-10px]');
        toast.classList.add('opacity-100', 'translate-y-0');
        clearTimeout(this.toastTimeout);
        this.toastTimeout = setTimeout(() => {
          toast.classList.add('opacity-0', 'translate-y-[-10px]');
          toast.classList.remove('opacity-100', 'translate-y-0');
        }, 2600);
      }

      // --- HELPERS ---
      getExercise(id) {
        return this.state.exercises.find(e => e.id === id) || { id, name: 'Unknown Exercise', muscle: 'Other', equipment: 'Gym' };
      }

      getActiveSplit() {
        return this.state.splits.find(s => s.id === this.state.activeSplitId) || this.state.splits[0];
      }

      getLastSessionForExercise(exerciseId) {
        // Search history from newest to oldest
        const sorted = [...this.state.history].sort((a, b) => new Date(b.date) - new Date(a.date));
        for (const workout of sorted) {
          const found = workout.exercises.find(e => e.exerciseId === exerciseId);
          if (found && found.sets && found.sets.length > 0) {
            return {
              date: workout.date,
              sets: found.sets
            };
          }
        }
        return null;
      }

      calcE1RM(weight, reps) {
        if (!weight || !reps) return 0;
        if (reps === 1) return weight;
        // Epley formula
        return Math.round(weight * (1 + reps / 30) * 10) / 10;
      }

      formatDuration(sec) {
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = sec % 60;
        if (h > 0) {
          return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }

      formatDateShort(iso) {
        const d = new Date(iso);
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      }

      getWeeklyStreak() {
        // Count workouts in the last 7 days
        const now = new Date();
        const sevenDaysAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
        return this.state.history.filter(h => new Date(h.date) >= sevenDaysAgo).length;
      }

      // --- NAVIGATION ---
      switchTab(tab) {
        this.currentTab = tab;
        this.renderNavigation();
        this.renderCurrentView();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      renderNavigation() {
        const navItems = [
          {
            id: 'workout',
            label: 'Workout',
            badge: this.state.activeSession ? 'LIVE' : null,
            icon: `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"/></svg>`
          },
          {
            id: 'routines',
            label: 'Routines',
            icon: `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>`
          },
          {
            id: 'progress',
            label: 'Progress',
            icon: `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18L9 11.25l4.306 4.307a11.95 11.95 0 015.814-5.519l2.74-1.22m0 0l-5.94-2.28m5.94 2.28l-2.28 5.941"/></svg>`
          },
          {
            id: 'history',
            label: 'History',
            icon: `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5"/></svg>`
          }
        ];

        // Desktop Nav
        const desktopNav = document.getElementById('desktop-nav');
        desktopNav.innerHTML = navItems.map(item => {
          const active = this.currentTab === item.id;
          return `
            <button onclick="app.switchTab('${item.id}')" class="w-full flex items-center justify-between px-3.5 py-3 rounded-xl text-sm font-semibold transition-all ${active ? 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 shadow-sm' : 'text-slate-400 hover:text-slate-100 hover:bg-slate-800/60'}">
              <span class="flex items-center gap-3">
                ${item.icon}
                ${item.label}
              </span>
              ${item.badge ? `<span class="px-2 py-0.5 text-[10px] font-mono font-bold rounded-full bg-emerald-500 text-slate-950 animate-pulse">${item.badge}</span>` : ''}
            </button>
          `;
        }).join('');

        // Mobile Nav
        const mobileNav = document.getElementById('mobile-nav');
        mobileNav.innerHTML = navItems.map(item => {
          const active = this.currentTab === item.id;
          return `
            <button onclick="app.switchTab('${item.id}')" class="relative flex flex-col items-center justify-center w-full h-full gap-1 transition-colors ${active ? 'text-emerald-400' : 'text-slate-400 hover:text-slate-200'}">
              ${item.badge ? `<span class="absolute top-1.5 right-5 w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>` : ''}
              ${item.icon}
              <span class="text-[11px] font-semibold">${item.label}</span>
            </button>
          `;
        }).join('');
      }

      renderCurrentView() {
        const container = document.getElementById('app-content');
        switch (this.currentTab) {
          case 'workout':
            container.innerHTML = this.state.activeSession ? this.renderActiveWorkoutView() : this.renderDashboardView();
            break;
          case 'routines':
            container.innerHTML = this.renderRoutinesView();
            break;
          case 'progress':
            container.innerHTML = this.renderProgressView();
            break;
          case 'history':
            container.innerHTML = this.renderHistoryView();
            break;
        }
      }

      // --- 3. VIEW 1: DASHBOARD & ACTIVE WORKOUT ---
      renderDashboardView() {
        const split = this.getActiveSplit();
        const selectedDay = split.days.find(d => d.id === this.state.selectedDayId) || split.days[0];
        if (selectedDay && selectedDay.id !== this.state.selectedDayId) {
          this.state.selectedDayId = selectedDay.id;
        }

        const weights = this.state.bodyWeights;
        const latestWeight = weights.length ? weights[weights.length - 1].weight : null;
        const prevWeight = weights.length > 1 ? weights[weights.length - 2].weight : null;
        const weightDiff = (latestWeight !== null && prevWeight !== null) ? (latestWeight - prevWeight).toFixed(1) : null;

        const weeklyCount = this.getWeeklyStreak();
        const targetPerWeek = split.days.length;

        return `
          <div class="space-y-6">
            <!-- Greeting & Quick Split Switcher -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">Ready to Lift</h1>
                <div class="flex items-center gap-2 mt-1">
                  <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Program:</span>
                  <select onchange="app.setActiveSplit(this.value)" aria-label="Select Active Workout Split" class="bg-slate-800/90 border border-slate-700 hover:border-sky-500/60 text-sky-400 text-xs sm:text-sm font-bold rounded-xl px-3 py-1.5 pr-7 focus:outline-none focus:border-emerald-400 max-w-[260px] sm:max-w-xs truncate transition">
                    ${this.state.splits.map(s => `<option value="${s.id}" ${s.id === split.id ? 'selected' : ''}>${s.name}</option>`).join('')}
                  </select>
                </div>
              </div>
              <div class="flex items-center gap-2 self-start sm:self-auto">
                <button onclick="app.openQuickSplitModal()" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-slate-200 transition">
                  <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h7"/></svg>
                  All Splits (${this.state.splits.length})
                </button>
              </div>
            </div>

            <!-- TOP METRIC CARDS -->
            <div class="grid grid-cols-2 gap-3 sm:gap-4">
              <!-- Body Weight Card -->
              <div class="bg-slate-800/80 border border-slate-700/70 rounded-2xl p-4 flex flex-col justify-between relative overflow-hidden">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Body Weight</span>
                  <button onclick="app.openWeightModal()" class="p-1.5 rounded-lg bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-400 transition" title="Log Weight">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                  </button>
                </div>
                <div class="mt-3 flex items-baseline gap-2 flex-wrap">
                  <span class="text-2xl sm:text-3xl font-mono font-bold text-white">${latestWeight !== null ? latestWeight + ' kg' : '-- kg'}</span>
                  ${weightDiff !== null ? `
                    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-mono font-semibold ${Number(weightDiff) <= 0 ? 'bg-emerald-500/15 text-emerald-400' : 'bg-amber-500/15 text-amber-400'}">
                      ${Number(weightDiff) > 0 ? '+' : ''}${weightDiff} kg
                    </span>
                  ` : ''}
                </div>
                <div class="mt-1.5 text-[11px] text-slate-400">
                  ${weights.length ? `Last logged ${this.formatDateShort(weights[weights.length - 1].date)}` : 'Tap + to log weight'}
                </div>
              </div>

              <!-- Weekly Consistency Card -->
              <div class="bg-slate-800/80 border border-slate-700/70 rounded-2xl p-4 flex flex-col justify-between">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">7-Day Streak</span>
                  <span class="w-7 h-7 rounded-lg bg-sky-500/15 text-sky-400 flex items-center justify-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.362 5.214A8.252 8.252 0 0112 21 8.25 8.25 0 016.038 7.048 8.287 8.287 0 009 9.6a8.983 8.983 0 013.361-6.867 8.21 8.21 0 003 2.48z"/></svg>
                  </span>
                </div>
                <div class="mt-3 flex items-baseline gap-1.5">
                  <span class="text-2xl sm:text-3xl font-mono font-bold text-white">${weeklyCount}</span>
                  <span class="text-sm font-mono text-slate-400">/ ${targetPerWeek} sessions</span>
                </div>
                <div class="w-full bg-slate-900 h-2 rounded-full mt-2 overflow-hidden">
                  <div class="bg-gradient-to-r from-sky-400 to-emerald-400 h-full rounded-full transition-all" style="width: ${Math.min(100, Math.round((weeklyCount / targetPerWeek) * 100))}%"></div>
                </div>
              </div>
            </div>

            <!-- TODAY'S WORKOUT SELECTOR & PREVIEW -->
            <div class="bg-slate-800/90 border border-slate-700/80 rounded-3xl p-5 sm:p-6 shadow-xl">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-slate-700/70">
                <div>
                  <span class="inline-flex items-center gap-1.5 text-xs font-bold uppercase tracking-wider text-emerald-400">
                    <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                    Scheduled Session
                  </span>
                  <div class="mt-1">
                    <select onchange="app.selectWorkoutDay(this.value)" class="bg-slate-900 border border-slate-700 text-white text-base sm:text-lg font-bold rounded-xl px-3 py-2 pr-8 focus:outline-none focus:border-emerald-500 w-full sm:w-auto">
                      ${split.days.map(d => `<option value="${d.id}" ${d.id === selectedDay.id ? 'selected' : ''}>${d.name}</option>`).join('')}
                    </select>
                  </div>
                </div>
                <button onclick="app.startWorkout('${selectedDay.id}')" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3.5 rounded-2xl bg-gradient-to-r from-emerald-500 to-emerald-400 hover:from-emerald-400 hover:to-emerald-300 text-slate-950 font-extrabold text-sm sm:text-base shadow-lg shadow-emerald-500/25 transition active:scale-[0.98]">
                  <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                  Start Workout
                </button>
              </div>

              <!-- Exercise Preview List with Progressive Overload Reference -->
              <div class="mt-4 space-y-2.5">
                <div class="flex items-center justify-between text-xs font-semibold uppercase tracking-wider text-slate-400 px-1">
                  <span>Exercises (${selectedDay.exercises.length})</span>
                  <span>Last Performance</span>
                </div>
                ${selectedDay.exercises.map((item, idx) => {
                  const ex = this.getExercise(item.exerciseId);
                  const last = this.getLastSessionForExercise(item.exerciseId);
                  const bestSet = last ? last.sets.reduce((best, s) => (s.weight * s.reps > best.weight * best.reps ? s : best), last.sets[0]) : null;
                  return `
                    <div class="flex items-center justify-between p-3.5 rounded-2xl bg-slate-900/75 border border-slate-800 hover:border-slate-700 transition">
                      <div class="flex items-center gap-3 min-w-0">
                        <span class="w-7 h-7 rounded-lg bg-slate-800 text-slate-300 font-mono text-xs font-bold flex items-center justify-center shrink-0">${idx + 1}</span>
                        <div class="truncate">
                          <div class="font-semibold text-sm sm:text-base text-white truncate">${ex.name}</div>
                          <div class="text-xs text-slate-400 flex items-center gap-2 mt-0.5">
                            <span class="text-sky-400 font-medium">${ex.muscle}</span>
                            <span>•</span>
                            <span>${item.targetSets} sets × ${item.targetReps} reps</span>
                          </div>
                        </div>
                      </div>
                      <div class="text-right shrink-0 ml-3">
                        ${bestSet ? `
                          <div class="text-xs font-mono font-bold text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-1 rounded-lg">
                            Last: ${bestSet.weight}kg × ${bestSet.reps}
                          </div>
                        ` : `
                          <span class="text-xs text-slate-500 font-mono">No history</span>
                        `}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>

              <!-- Quick Empty Workout Option -->
              <div class="mt-5 pt-4 border-t border-slate-700/60 flex items-center justify-between">
                <span class="text-xs text-slate-400">Want to freestyle today?</span>
                <button onclick="app.startEmptyWorkout()" class="text-xs font-semibold text-sky-400 hover:text-sky-300 underline underline-offset-4">
                  + Start Empty Session
                </button>
              </div>
            </div>
          </div>
        `;
      }

      selectWorkoutDay(dayId) {
        this.state.selectedDayId = dayId;
        this.saveState();
        this.renderCurrentView();
      }

      startWorkout(dayId) {
        const split = this.getActiveSplit();
        const day = split.days.find(d => d.id === dayId);
        if (!day) return;

        const exercises = day.exercises.map(item => {
          const last = this.getLastSessionForExercise(item.exerciseId);
          const sets = [];
          for (let i = 0; i < item.targetSets; i++) {
            const prevSet = last && last.sets[i] ? last.sets[i] : (last && last.sets[0] ? last.sets[0] : null);
            sets.push({
              weight: prevSet ? prevSet.weight : '',
              reps: prevSet ? prevSet.reps : '',
              rpe: prevSet && prevSet.rpe ? prevSet.rpe : 8,
              done: false
            });
          }
          return {
            exerciseId: item.exerciseId,
            targetReps: item.targetReps,
            sets
          };
        });

        this.state.activeSession = {
          dayId: day.id,
          name: day.name,
          startTime: Date.now(),
          exercises
        };
        this.saveState();
        this.renderNavigation();
        this.renderCurrentView();
        this.startSessionTicker();
        this.showToast('Workout started! Crush it.');
      }

      startEmptyWorkout() {
        this.state.activeSession = {
          dayId: 'custom_' + Date.now(),
          name: 'Freestyle Gym Session',
          startTime: Date.now(),
          exercises: []
        };
        this.saveState();
        this.renderNavigation();
        this.renderCurrentView();
        this.startSessionTicker();
      }

      startSessionTicker() {
        clearInterval(this.sessionInterval);
        this.sessionInterval = setInterval(() => {
          const el = document.getElementById('active-session-timer');
          if (el && this.state.activeSession) {
            const elapsed = Math.floor((Date.now() - this.state.activeSession.startTime) / 1000);
            el.textContent = this.formatDuration(elapsed);
          }
        }, 1000);
      }

      renderActiveWorkoutView() {
        const session = this.state.activeSession;
        const elapsed = Math.floor((Date.now() - session.startTime) / 1000);

        return `
          <div class="space-y-5 pb-10">
            <!-- STICKY LIVE SESSION HEADER -->
            <div class="sticky top-14 md:top-0 z-20 bg-slate-900/95 backdrop-blur-md py-3 border-b border-slate-800 flex flex-wrap items-center justify-between gap-3">
              <div>
                <div class="flex items-center gap-2">
                  <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span id="active-session-timer" class="font-mono font-bold text-lg text-emerald-400">${this.formatDuration(elapsed)}</span>
                </div>
                <h2 class="text-base sm:text-lg font-extrabold text-white truncate max-w-[220px] sm:max-w-md">${session.name}</h2>
              </div>

              <div class="flex items-center gap-2">
                <button onclick="app.openRestTimerModal()" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-sky-400 transition">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                  Rest Timer
                </button>
                <button onclick="app.finishWorkout()" class="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs sm:text-sm shadow-lg shadow-emerald-500/20 transition">
                  Finish
                </button>
              </div>
            </div>

            <!-- QUICK REST PRESET BAR -->
            <div class="bg-slate-800/70 border border-slate-700/70 rounded-2xl p-3 flex items-center justify-between gap-2 overflow-x-auto">
              <span class="text-xs font-semibold text-slate-400 shrink-0 pl-1">Quick Rest:</span>
              <div class="flex items-center gap-1.5">
                ${[60, 90, 120, 180].map(sec => `
                  <button onclick="app.startRestTimer(${sec})" class="px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-emerald-500/20 hover:text-emerald-400 hover:border-emerald-500/40 border border-slate-700 text-xs font-mono font-bold text-slate-200 transition">
                    ${sec < 120 ? sec + 's' : (sec / 60) + 'm'}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- ACTIVE EXERCISE CARDS -->
            <div class="space-y-4">
              ${session.exercises.map((exItem, exIdx) => {
                const ex = this.getExercise(exItem.exerciseId);
                const last = this.getLastSessionForExercise(exItem.exerciseId);
                return `
                  <div class="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-4 sm:p-5 shadow-lg">
                    <div class="flex items-start justify-between gap-2 mb-3">
                      <div>
                        <div class="flex items-center gap-2 flex-wrap">
                          <h3 class="font-bold text-base sm:text-lg text-white">${ex.name}</h3>
                          <span class="px-2 py-0.5 rounded-md bg-slate-700/80 text-[11px] font-semibold text-sky-400">${ex.muscle}</span>
                        </div>
                        ${last ? `
                          <p class="text-xs text-slate-400 mt-1 font-mono">
                            Last (${this.formatDateShort(last.date)}): <span class="text-emerald-400">${last.sets.map(s => `${s.weight}×${s.reps}`).join(', ')}</span>
                          </p>
                        ` : `<p class="text-xs text-slate-500 mt-1">First time logging this lift</p>`}
                      </div>
                      <div class="flex items-center gap-1 shrink-0">
                        <button onclick="app.openSwapExerciseModal(${exIdx})" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-slate-900 hover:bg-sky-500/15 border border-slate-700 hover:border-sky-500/40 text-xs font-semibold text-sky-400 transition" title="Swap for Same-Muscle Variation">
                          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>
                          <span>Swap</span>
                        </button>
                        <button onclick="app.removeExerciseFromActive(${exIdx})" class="p-1.5 rounded-lg text-slate-500 hover:text-rose-400 hover:bg-rose-500/10" title="Remove Exercise">
                          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                      </div>
                    </div>

                    <!-- Set Table Header -->
                    <div class="grid grid-cols-12 gap-2 text-[11px] font-bold uppercase tracking-wider text-slate-400 px-1 mb-2 text-center">
                      <div class="col-span-2 text-left">Set</div>
                      <div class="col-span-3">kg</div>
                      <div class="col-span-3">Reps</div>
                      <div class="col-span-2">RPE</div>
                      <div class="col-span-2">Done</div>
                    </div>

                    <!-- Set Rows -->
                    <div class="space-y-2">
                      ${exItem.sets.map((set, setIdx) => `
                        <div class="grid grid-cols-12 gap-2 items-center p-1.5 rounded-xl transition-colors ${set.done ? 'bg-emerald-500/15 border border-emerald-500/30' : 'bg-slate-900/80 border border-slate-800'}">
                          <div class="col-span-2 flex items-center gap-1 pl-1">
                            <span class="font-mono font-bold text-xs ${set.done ? 'text-emerald-400' : 'text-slate-400'}">${setIdx + 1}</span>
                            ${exItem.sets.length > 1 ? `
                              <button onclick="app.removeSetFromActive(${exIdx}, ${setIdx})" class="text-slate-600 hover:text-rose-400 text-xs px-1">×</button>
                            ` : ''}
                          </div>
                          <div class="col-span-3">
                            <input type="number" step="0.5" placeholder="0" value="${set.weight}"
                              onchange="app.updateActiveSet(${exIdx}, ${setIdx}, 'weight', this.value)"
                              class="w-full bg-slate-950 border border-slate-700/80 focus:border-emerald-400 rounded-lg py-2 px-1 text-center font-mono font-bold text-sm text-white focus:outline-none" />
                          </div>
                          <div class="col-span-3">
                            <input type="number" placeholder="0" value="${set.reps}"
                              onchange="app.updateActiveSet(${exIdx}, ${setIdx}, 'reps', this.value)"
                              class="w-full bg-slate-950 border border-slate-700/80 focus:border-emerald-400 rounded-lg py-2 px-1 text-center font-mono font-bold text-sm text-white focus:outline-none" />
                          </div>
                          <div class="col-span-2">
                            <select onchange="app.updateActiveSet(${exIdx}, ${setIdx}, 'rpe', this.value)"
                              class="w-full bg-slate-950 border border-slate-700/80 focus:border-emerald-400 rounded-lg py-2 px-0.5 text-center font-mono text-xs font-semibold text-slate-200 focus:outline-none">
                              ${[6, 7, 7.5, 8, 8.5, 9, 9.5, 10].map(val => `<option value="${val}" ${Number(set.rpe) === val ? 'selected' : ''}>${val}</option>`).join('')}
                            </select>
                          </div>
                          <div class="col-span-2 flex justify-center">
                            <button onclick="app.toggleActiveSetDone(${exIdx}, ${setIdx})"
                              class="w-9 h-9 rounded-xl flex items-center justify-center transition-all ${set.done ? 'bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/30' : 'bg-slate-800 hover:bg-slate-700 text-slate-400 border border-slate-700'}">
                              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                            </button>
                          </div>
                        </div>
                      `).join('')}
                    </div>

                    <button onclick="app.addSetToActive(${exIdx})" class="mt-3 w-full py-2 rounded-xl bg-slate-900 hover:bg-slate-700/70 border border-dashed border-slate-700 text-xs font-semibold text-slate-300 transition">
                      + Add Set
                    </button>
                  </div>
                `;
              }).join('')}
            </div>

            <!-- ADD EXERCISE & CANCEL BUTTONS -->
            <div class="flex flex-col sm:flex-row gap-3 pt-2">
              <button onclick="app.openAddExerciseToActiveModal()" class="flex-1 py-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-sm font-bold text-sky-400 transition">
                + Add Exercise to Session
              </button>
              <button onclick="app.confirmCancelWorkout()" class="py-3.5 px-5 rounded-2xl bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-sm font-semibold text-rose-400 transition">
                Discard Session
              </button>
            </div>
          </div>
        `;
      }

      updateActiveSet(exIdx, setIdx, field, val) {
        if (!this.state.activeSession) return;
        const num = val === '' ? '' : Number(val);
        this.state.activeSession.exercises[exIdx].sets[setIdx][field] = num;
        this.saveState();
      }

      toggleActiveSetDone(exIdx, setIdx) {
        if (!this.state.activeSession) return;
        const set = this.state.activeSession.exercises[exIdx].sets[setIdx];
        set.done = !set.done;
        this.saveState();
        this.renderCurrentView();
        if (set.done) {
          // Auto-start 90s rest timer when completing a set
          this.startRestTimer(90);
        }
      }

      addSetToActive(exIdx) {
        const sets = this.state.activeSession.exercises[exIdx].sets;
        const lastSet = sets[sets.length - 1] || { weight: '', reps: '', rpe: 8 };
        sets.push({ weight: lastSet.weight, reps: lastSet.reps, rpe: lastSet.rpe, done: false });
        this.saveState();
        this.renderCurrentView();
      }

      removeSetFromActive(exIdx, setIdx) {
        this.state.activeSession.exercises[exIdx].sets.splice(setIdx, 1);
        this.saveState();
        this.renderCurrentView();
      }

      removeExerciseFromActive(exIdx) {
        this.state.activeSession.exercises.splice(exIdx, 1);
        this.saveState();
        this.renderCurrentView();
      }

      openSwapExerciseModal(exIdx) {
        if (!this.state.activeSession) return;
        const currentItem = this.state.activeSession.exercises[exIdx];
        const currentEx = this.getExercise(currentItem.exerciseId);

        const sameMuscle = this.state.exercises.filter(e => e.muscle === currentEx.muscle && e.id !== currentEx.id);
        const otherExercises = this.state.exercises.filter(e => e.muscle !== currentEx.muscle);

        this.openModal(`
          <div class="p-6 flex flex-col max-h-[85vh]">
            <div class="flex items-start justify-between pb-3 border-b border-slate-700 gap-2">
              <div>
                <span class="text-[11px] font-bold uppercase tracking-wider text-sky-400">Equipment Busy? Swap Movement</span>
                <h3 class="text-base sm:text-lg font-bold text-white mt-0.5">Replace ${currentEx.name}</h3>
              </div>
              <button onclick="app.closeModal()" class="text-slate-400 hover:text-white p-1">✕</button>
            </div>

            <div class="overflow-y-auto py-3 space-y-4">
              <div>
                <div class="text-xs font-bold uppercase tracking-wider text-emerald-400 mb-2">
                  Same Muscle Alternatives (${currentEx.muscle})
                </div>
                <div class="space-y-2">
                  ${sameMuscle.length ? sameMuscle.map(alt => {
                    const last = this.getLastSessionForExercise(alt.id);
                    const bestSet = last ? last.sets[0] : null;
                    return `
                      <button onclick="app.swapActiveExercise(${exIdx}, '${alt.id}')" class="w-full text-left p-3 rounded-xl bg-slate-900 hover:bg-emerald-500/15 border border-slate-800 hover:border-emerald-500/40 flex items-center justify-between transition">
                        <div class="min-w-0 pr-2">
                          <div class="font-semibold text-sm text-white truncate">${alt.name}</div>
                          <div class="text-xs text-slate-400 mt-0.5">${alt.equipment} ${bestSet ? `• Last: ${bestSet.weight}kg × ${bestSet.reps}` : ''}</div>
                        </div>
                        <span class="px-2.5 py-1 rounded-lg bg-emerald-500/15 text-emerald-400 text-xs font-bold shrink-0">Swap</span>
                      </button>
                    `;
                  }).join('') : `<p class="text-xs text-slate-400">No other ${currentEx.muscle} movements found.</p>`}
                </div>
              </div>

              <div>
                <div class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                  Other Muscle Groups
                </div>
                <div class="space-y-2">
                  ${otherExercises.map(alt => `
                    <button onclick="app.swapActiveExercise(${exIdx}, '${alt.id}')" class="w-full text-left p-3 rounded-xl bg-slate-900/60 hover:bg-slate-800 border border-slate-800 flex items-center justify-between transition">
                      <div class="min-w-0 pr-2">
                        <div class="font-semibold text-sm text-slate-200 truncate">${alt.name}</div>
                        <div class="text-xs text-slate-500">${alt.muscle} • ${alt.equipment}</div>
                      </div>
                      <span class="text-sky-400 text-xs font-bold shrink-0">Select</span>
                    </button>
                  `).join('')}
                </div>
              </div>
            </div>
          </div>
        `);
      }

      swapActiveExercise(exIdx, newExerciseId) {
        if (!this.state.activeSession) return;
        const currentItem = this.state.activeSession.exercises[exIdx];
        const last = this.getLastSessionForExercise(newExerciseId);
        const newEx = this.getExercise(newExerciseId);

        // Preserve set count while pre-filling weights/reps from new exercise's history if available
        const updatedSets = currentItem.sets.map((s, idx) => {
          const histSet = last && last.sets[idx] ? last.sets[idx] : (last && last.sets[0] ? last.sets[0] : null);
          return {
            weight: histSet ? histSet.weight : '',
            reps: histSet ? histSet.reps : s.reps,
            rpe: s.rpe || 8,
            done: false
          };
        });

        this.state.activeSession.exercises[exIdx] = {
          exerciseId: newExerciseId,
          targetReps: currentItem.targetReps,
          sets: updatedSets
        };

        this.saveState();
        this.closeModal();
        this.renderCurrentView();
        this.showToast(`Swapped to ${newEx.name}`);
      }

      finishWorkout() {
        const session = this.state.activeSession;
        if (!session) return;

        // Filter completed sets (or sets with weight & reps filled)
        const completedExercises = session.exercises.map(ex => {
          const validSets = ex.sets.filter(s => (s.done || (s.weight > 0 && s.reps > 0)) && Number(s.reps) > 0)
            .map(s => ({ weight: Number(s.weight) || 0, reps: Number(s.reps) || 0, rpe: Number(s.rpe) || 8 }));
          return {
            exerciseId: ex.exerciseId,
            sets: validSets
          };
        }).filter(ex => ex.sets.length > 0);

        if (completedExercises.length === 0) {
          this.showToast('Log at least one valid set before finishing!');
          return;
        }

        const durationSec = Math.max(60, Math.floor((Date.now() - session.startTime) / 1000));
        const record = {
          id: 'hist_' + Date.now(),
          date: new Date().toISOString(),
          dayId: session.dayId,
          name: session.name,
          durationSec,
          exercises: completedExercises
        };

        this.state.history.unshift(record);

        // Advance selectedDayId to next day in split
        const split = this.getActiveSplit();
        const currIdx = split.days.findIndex(d => d.id === session.dayId);
        if (currIdx !== -1 && split.days.length > 0) {
          const nextIdx = (currIdx + 1) % split.days.length;
          this.state.selectedDayId = split.days[nextIdx].id;
        }

        this.state.activeSession = null;
        clearInterval(this.sessionInterval);
        this.stopRestTimer();
        this.saveState();
        this.renderNavigation();
        this.switchTab('history');
        this.showToast('Workout saved to history!');
      }

      confirmCancelWorkout() {
        this.openModal(`
          <div class="p-6 text-center space-y-4">
            <div class="w-12 h-12 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center mx-auto">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
            </div>
            <h3 class="text-lg font-bold text-white">Discard Active Workout?</h3>
            <p class="text-sm text-slate-400">All sets logged in this session will be lost.</p>
            <div class="flex gap-3 pt-2">
              <button onclick="app.closeModal()" class="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm font-semibold text-white">Keep Lifting</button>
              <button onclick="app.discardWorkout()" class="flex-1 py-2.5 rounded-xl bg-rose-500 hover:bg-rose-400 text-sm font-bold text-white">Discard</button>
            </div>
          </div>
        `);
      }

      discardWorkout() {
        this.state.activeSession = null;
        clearInterval(this.sessionInterval);
        this.stopRestTimer();
        this.saveState();
        this.closeModal();
        this.renderNavigation();
        this.renderCurrentView();
        this.showToast('Session discarded.');
      }

      // --- REST TIMER ENGINE ---
      startRestTimer(seconds) {
        clearInterval(this.restInterval);
        this.restTotalSeconds = seconds;
        this.restRemainingSeconds = seconds;
        this.updateRestTimerUI();

        const bar = document.getElementById('floating-rest-bar');
        const pill = document.getElementById('mobile-timer-pill');
        bar.classList.remove('hidden');
        pill.classList.remove('hidden');
        pill.classList.add('flex');

        this.restInterval = setInterval(() => {
          this.restRemainingSeconds--;
          if (this.restRemainingSeconds <= 0) {
            this.playAlertSound();
            this.showToast('Rest complete! Next set.');
            this.stopRestTimer();
          } else {
            this.updateRestTimerUI();
          }
        }, 1000);
      }

      adjustRestTimer(delta) {
        this.restRemainingSeconds = Math.max(5, this.restRemainingSeconds + delta);
        this.restTotalSeconds = Math.max(this.restTotalSeconds, this.restRemainingSeconds);
        this.updateRestTimerUI();
      }

      stopRestTimer() {
        clearInterval(this.restInterval);
        this.restRemainingSeconds = 0;
        document.getElementById('floating-rest-bar').classList.add('hidden');
        const pill = document.getElementById('mobile-timer-pill');
        pill.classList.add('hidden');
        pill.classList.remove('flex');
      }

      updateRestTimerUI() {
        const formatted = this.formatDuration(this.restRemainingSeconds);
        const pct = Math.max(0, Math.min(100, (this.restRemainingSeconds / this.restTotalSeconds) * 100));
        const disp = document.getElementById('floating-rest-display');
        const prog = document.getElementById('floating-rest-progress');
        const pillText = document.getElementById('mobile-timer-pill-text');
        if (disp) disp.textContent = formatted;
        if (prog) prog.style.width = `${pct}%`;
        if (pillText) pillText.textContent = formatted;
      }

      openRestTimerModal() {
        this.openModal(`
          <div class="p-6 space-y-5">
            <div class="flex items-center justify-between">
              <h3 class="text-lg font-bold text-white">Rest Timer Presets</h3>
              <button onclick="app.closeModal()" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <div class="grid grid-cols-2 gap-3">
              ${[
                { label: '60 Sec', sub: 'Isolation / Pump', sec: 60 },
                { label: '90 Sec', sub: 'Hypertrophy Standard', sec: 90 },
                { label: '2 Min', sub: 'Heavy Accessories', sec: 120 },
                { label: '3 Min', sub: 'Compound Strength', sec: 180 }
              ].map(p => `
                <button onclick="app.startRestTimer(${p.sec}); app.closeModal();" class="p-4 rounded-2xl bg-slate-900 hover:bg-emerald-500/15 border border-slate-700 hover:border-emerald-500/50 text-left transition">
                  <div class="font-mono font-bold text-lg text-emerald-400">${p.label}</div>
                  <div class="text-xs text-slate-400 mt-0.5">${p.sub}</div>
                </button>
              `).join('')}
            </div>
          </div>
        `);
      }

      // --- 4. VIEW 2: ROUTINES & EXERCISE LIBRARY ---

                </div>

                  return `

                      <div>
                        <div class="flex items-start justify-between gap-2">
                          <h3 class="font-bold text-base text-white">${split.name}</h3>
                          ${isActive ? `<span class="px-2 py-0.5 rounded-full bg-emerald-500 text-slate-950 text-[10px] font-extrabold uppercase shrink-0">Active</span>` : `<span class="px-2 py-0.5 rounded-md bg-slate-900 text-slate-400 text-[10px] font-mono font-bold shrink-0">${split.days.length} Days</span>`}
                        </div>
                        <p class="text-xs text-slate-400 mt-1">${split.description || `${split.days.length}-Day Routine`}</p>
                        <div class="mt-3 flex flex-wrap gap-1.5">
                          ${split.days.map(d => `<span class="px-2 py-0.5 rounded-md bg-slate-900 text-[11px] font-medium text-slate-300 border border-slate-800">${d.name.split('(')[0].split('—')[0].trim()}</span>`).join('')}
                        </div>
                      </div>
                      <div class="mt-3.5 pt-2.5 border-t border-slate-700/50 flex items-center justify-between" onclick="event.stopPropagation()">
                        <button onclick="app.cloneSplit('${split.id}')" class="text-xs font-semibold text-sky-400 hover:text-sky-300 inline-flex items-center gap-1">
                          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                          Clone & Customize
                        </button>
                        ${split.id.startsWith('split_custom_') || split.id.startsWith('split_17') ? `
                          <button onclick="app.deleteCustomSplit('${split.id}')" class="text-xs font-semibold text-rose-400 hover:text-rose-300">Delete</button>
                        ` : `<span class="text-[11px] text-slate-500">Template</span>`}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>

              <!-- Active Split Day Editor -->
              <div class="bg-slate-800/80 border border-slate-700/80 rounded-3xl p-5 space-y-4">
                <div class="flex items-center justify-between">
                  <h2 class="text-base sm:text-lg font-bold text-white">Days in "${activeSplit.name}"</h2>
                  <button onclick="app.openAddDayModal()" class="text-xs font-bold text-sky-400 hover:text-sky-300">+ Add Day</button>
                </div>

                <div class="space-y-3">
                  ${activeSplit.days.map((day, dIdx) => `
                    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4">
                      <div class="flex items-center justify-between mb-3">
                        <div class="font-bold text-sm sm:text-base text-emerald-400">${day.name}</div>
                        <div class="flex items-center gap-2">

                            + Exercise
                          </button>
                          ${activeSplit.days.length > 1 ? `
                            <button onclick="app.deleteDayFromSplit('${day.id}')" class="p-1 text-slate-500 hover:text-rose-400" title="Delete Day">
                              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            </button>
                          ` : ''}
                        </div>
                      </div>

                      <div class="space-y-2">
                        ${day.exercises.map((item, eIdx) => {
                          const ex = this.getExercise(item.exerciseId);
                          return `
                            <div class="flex items-center justify-between text-xs sm:text-sm py-2 px-3 rounded-xl bg-slate-850 border border-slate-800/80">
                              <div class="min-w-0 pr-2">
                                <span class="font-semibold text-slate-200">${ex.name}</span>
                                <span class="text-slate-500 ml-1.5">(${item.targetSets} × ${item.targetReps})</span>
                              </div>
                              <div class="flex items-center gap-1 shrink-0">
                                <button onclick="app.moveExerciseInDay('${day.id}', ${eIdx}, -1)" ${eIdx === 0 ? 'disabled' : ''} class="p-1 text-slate-400 hover:text-white disabled:opacity-30">↑</button>
                                <button onclick="app.moveExerciseInDay('${day.id}', ${eIdx}, 1)" ${eIdx === day.exercises.length - 1 ? 'disabled' : ''} class="p-1 text-slate-400 hover:text-white disabled:opacity-30">↓</button>
                                <button onclick="app.removeExerciseFromDay('${day.id}', ${eIdx})" class="p-1 text-slate-500 hover:text-rose-400 ml-1">✕</button>

                  <h2 class="text-xl font-extrabold text-white">Exercise Library</h2>
                  <p class="text-xs sm:text-sm text-slate-400">${this.state.exercises.length} commercial gym movements available</p>
                </div>
                <button onclick="app.openCreateExerciseModal()" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-emerald-400">
                  + Custom Exercise
                </button>
              </div>

              <!-- Muscle Group Filter Pills -->
              <div class="flex items-center gap-2 overflow-x-auto pb-1">
                ${muscles.map(m => `
                  <button onclick="app.setMuscleFilter('${m}')" class="px-3 py-1.5 rounded-full text-xs font-semibold shrink-0 transition ${this.routineFilterMuscle === m ? 'bg-sky-500 text-slate-950' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">
                    ${m}

                `).join('')}

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">

                  <div class="p-3.5 rounded-2xl bg-slate-800/70 border border-slate-700/60 flex items-center justify-between">
                    <div>
                      <div class="font-semibold text-sm text-white">${ex.name}</div>
                      <div class="text-xs text-slate-400 mt-0.5">${ex.muscle} • ${ex.equipment}</div>
                    </div>
                    <span class="px-2.5 py-1 rounded-lg bg-slate-900 text-[11px] font-mono text-sky-400 border border-slate-800">${ex.muscle}</span>

              </div>
            </section>

        `;
      }

      setActiveSplit(splitId) {
        this.state.activeSplitId = splitId;
        const split = this.getActiveSplit();
        if (split && split.days.length > 0) {
          this.state.selectedDayId = split.days[0].id;
        }
        this.saveState();
        this.renderCurrentView();
        this.showToast(`Switched to ${split.name}`);
      }

      cloneSplit(splitId) {
        const source = this.state.splits.find(s => s.id === splitId);
        if (!source) return;
        const newSplitId = 'split_custom_' + Date.now();
        const clonedDays = source.days.map((d, idx) => ({
          id: 'day_custom_' + Date.now() + '_' + idx,
          name: d.name,
          exercises: d.exercises.map(e => ({ ...e }))
        }));
        const cloned = {
          id: newSplitId,
          name: `${source.name} (Custom)`,
          description: `Customized copy of ${source.name}`,
          days: clonedDays
        };
        this.state.splits.push(cloned);
        this.state.activeSplitId = newSplitId;
        if (clonedDays.length > 0) {
          this.state.selectedDayId = clonedDays[0].id;
        }
        this.saveState();
        this.renderCurrentView();
        this.showToast('Cloned split! Edit days & exercises below.');
      }

      deleteCustomSplit(splitId) {
        if (this.state.splits.length <= 1) return;
        this.state.splits = this.state.splits.filter(s => s.id !== splitId);
        if (this.state.activeSplitId === splitId) {
          this.state.activeSplitId = this.state.splits[0].id;
          this.state.selectedDayId = this.state.splits[0].days[0]?.id || '';
        }
        this.saveState();
        this.renderCurrentView();
        this.showToast('Custom split deleted.');
      }

      openQuickSplitModal() {
        this.openModal(`

            <div class="flex items-center justify-between pb-3 border-b border-slate-700">
              <div>
                <h3 class="text-lg font-bold text-white">Choose Workout Split</h3>
                <p class="text-xs text-slate-400">Select a training frequency & style for your week</p>
              </div>
              <button onclick="app.closeModal()" class="text-slate-400 hover:text-white p-1">✕</button>
            </div>

                const active = s.id === this.state.activeSplitId;
                return `
                  <button onclick="app.setActiveSplit('${s.id}'); app.closeModal();" class="w-full text-left p-3.5 rounded-2xl border transition ${active ? 'bg-emerald-500/15 border-emerald-500/50' : 'bg-slate-900 hover:bg-slate-800 border-slate-800'}">

                    <div class="mt-2 flex flex-wrap gap-1">

      setMuscleFilter(muscle) {
        this.routineFilterMuscle = muscle;
        this.renderCurrentView();
      }

      moveExerciseInDay(dayId, idx, dir) {
        const split = this.getActiveSplit();
        const day = split.days.find(d => d.id === dayId);
        if (!day) return;
        const target = idx + dir;
        if (target < 0 || target >= day.exercises.length) return;
        const temp = day.exercises[idx];
        day.exercises[idx] = day.exercises[target];
        day.exercises[target] = temp;
        this.saveState();
        this.renderCurrentView();
      }

      removeExerciseFromDay(dayId, idx) {
        const split = this.getActiveSplit();
        const day = split.days.find(d => d.id === dayId);
        if (!day) return;
        day.exercises.splice(idx, 1);
        this.saveState();
        this.renderCurrentView();
      }

      deleteDayFromSplit(dayId) {
        const split = this.getActiveSplit();
        split.days = split.days.filter(d => d.id !== dayId);
        this.saveState();
        this.renderCurrentView();
      }

      // --- 5. VIEW 3: PROGRESS & ANALYTICS ---
      renderProgressView() {
        // Compute PRs across all history
        const prs = {};
        const muscleVolume = {};

        this.state.history.forEach(workout => {
          workout.exercises.forEach(exItem => {
            const ex = this.getExercise(exItem.exerciseId);
            exItem.sets.forEach(s => {
              const w = Number(s.weight) || 0;
              const r = Number(s.reps) || 0;
              const e1rm = this.calcE1RM(w, r);
              if (!prs[ex.id] || e1rm > prs[ex.id].e1rm) {
                prs[ex.id] = { name: ex.name, muscle: ex.muscle, weight: w, reps: r, e1rm, date: workout.date };
              }
              // Weekly muscle volume (last 7 days)
              const isRecent = (Date.now() - new Date(workout.date).getTime()) <= 7 * 24 * 60 * 60 * 1000;
              if (isRecent) {
                muscleVolume[ex.muscle] = (muscleVolume[ex.muscle] || 0) + 1;
              }
            });
          });
        });

        const prList = Object.values(prs).sort((a, b) => b.e1rm - a.e1rm).slice(0, 6);
        const compoundOptions = ['ex_bench', 'ex_squat', 'ex_rdl', 'ex_bb_row', 'ex_lat_pulldown', 'ex_incline_db', 'ex_ohp_bb', 'ex_hack_squat'];

        return `
          <div class="space-y-6">
            <div>
              <h1 class="text-2xl font-extrabold text-white">Progress & Analytics</h1>
              <p class="text-sm text-slate-400">Track progressive overload, body weight trends, and PRs.</p>
            </div>

            <!-- 1. BODY WEIGHT CHART -->
            <div class="bg-slate-800/85 border border-slate-700/80 rounded-3xl p-5">
              <div class="flex items-center justify-between mb-4">
                <div>
                  <h2 class="font-bold text-base sm:text-lg text-white">Body Weight Trend (kg)</h2>
                  <p class="text-xs text-slate-400">Logged weigh-ins over time</p>
                </div>
                <button onclick="app.openWeightModal()" class="px-3 py-1.5 rounded-xl bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-400 text-xs font-bold">
                  + Log Weight
                </button>
              </div>
              ${this.renderLineChartSVG(
                this.state.bodyWeights.map(w => ({ label: this.formatDateShort(w.date), value: w.weight })),
                '#10b981',
                'kg'
              )}
            </div>

            <!-- 2. COMPOUND LIFT ESTIMATED 1RM CHART -->
            <div class="bg-slate-800/85 border border-slate-700/80 rounded-3xl p-5">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
                <div>
                  <h2 class="font-bold text-base sm:text-lg text-white">Strength Progression (Est. 1RM)</h2>
                  <p class="text-xs text-slate-400">Calculated via Epley formula from top sets</p>
                </div>
                <select onchange="app.selectCompoundChart(this.value)" class="bg-slate-900 border border-slate-700 text-xs sm:text-sm font-semibold text-white rounded-xl px-3 py-2 focus:outline-none focus:border-sky-400">
                  ${compoundOptions.map(id => {
                    const ex = this.getExercise(id);
                    return `<option value="${id}" ${id === this.selectedCompoundId ? 'selected' : ''}>${ex.name}</option>`;
                  }).join('')}
                </select>
              </div>
              ${this.renderCompoundChart()}
            </div>

            <!-- 3. WEEKLY MUSCLE GROUP VOLUME -->
            <div class="bg-slate-800/85 border border-slate-700/80 rounded-3xl p-5">
              <h2 class="font-bold text-base sm:text-lg text-white mb-1">Weekly Working Sets by Muscle</h2>
              <p class="text-xs text-slate-400 mb-4">Target 10–20 hard sets per muscle group per week for hypertrophy</p>
              ${this.renderMuscleVolumeBars(muscleVolume)}
            </div>

            <!-- 4. PERSONAL RECORDS TROPHY WALL -->
            <div class="bg-slate-800/85 border border-slate-700/80 rounded-3xl p-5">
              <div class="flex items-center gap-2 mb-4">
                <span class="text-amber-400">
                  <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M5 3h14v2h3v4c0 2.76-2.24 5-5 5h-.35A6.99 6.99 0 0113 16.92V19h4v2H7v-2h4v-2.08A6.99 6.99 0 017.35 14H7c-2.76 0-5-2.24-5-5V5h3V3zm0 4H4v2c0 1.65 1.35 3 3 3h.09A6.97 6.97 0 017 11V7H5zm14 0h-2v4c0 .34-.03.67-.09 1H17c1.65 0 3-1.35 3-3V7h-1z"/></svg>
                </span>
                <h2 class="font-bold text-base sm:text-lg text-white">All-Time Personal Records</h2>
              </div>
              ${prList.length ? `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  ${prList.map(pr => `
                    <div class="p-3.5 rounded-2xl bg-slate-900/90 border border-slate-800 flex items-center justify-between">
                      <div class="min-w-0 pr-2">
                        <div class="font-bold text-sm text-white truncate">${pr.name}</div>
                        <div class="text-xs text-slate-400 mt-0.5">Best: <span class="text-slate-200 font-mono">${pr.weight}kg × ${pr.reps}</span> • ${this.formatDateShort(pr.date)}</div>
                      </div>
                      <div class="text-right shrink-0">
                        <div class="text-[10px] uppercase tracking-wider text-amber-400 font-bold">Est. 1RM</div>
                        <div class="font-mono font-extrabold text-base text-white">${pr.e1rm} kg</div>
                      </div>

      selectCompoundChart(id) {
        this.selectedCompoundId = id;
        this.renderCurrentView();
      }

      renderCompoundChart() {
        const sortedHistory = [...this.state.history].sort((a, b) => new Date(a.date) - new Date(b.date));
        const points = [];
        sortedHistory.forEach(w => {
          const found = w.exercises.find(e => e.exerciseId === this.selectedCompoundId);
          if (found && found.sets.length > 0) {
            const maxE1RM = Math.max(...found.sets.map(s => this.calcE1RM(s.weight, s.reps)));
            if (maxE1RM > 0) {
              points.push({ label: this.formatDateShort(w.date), value: maxE1RM });
            }
          }
        });
        return this.renderLineChartSVG(points, '#38bdf8', 'kg');
      }

      renderLineChartSVG(points, strokeColor, unit) {
        if (!points || points.length === 0) {
          return `<div class="h-44 flex items-center justify-center text-sm text-slate-500 bg-slate-900/60 rounded-2xl">Not enough data logged yet</div>`;
        }
        if (points.length === 1) {
          return `
            <div class="h-44 flex flex-col items-center justify-center bg-slate-900/60 rounded-2xl">
              <div class="text-2xl font-mono font-bold text-white">${points[0].value} ${unit}</div>
              <div class="text-xs text-slate-400 mt-1">Logged on ${points[0].label} (log 1 more session to see trend line)</div>
            </div>
          `;
        }

        const width = 600;
        const height = 200;
        const padX = 42;
        const padY = 28;
        const values = points.map(p => p.value);
        const minVal = Math.min(...values);
        const maxVal = Math.max(...values);
        const range = maxVal - minVal || 1;

        const coords = points.map((p, i) => {
          const x = padX + (i / (points.length - 1)) * (width - padX * 2);
          const y = height - padY - ((p.value - minVal) / range) * (height - padY * 2);
          return { x, y, ...p };
        });

        const polylinePoints = coords.map(c => `${c.x},${c.y}`).join(' ');
        const areaPoints = `${coords[0].x},${height - padY} ${polylinePoints} ${coords[coords.length - 1].x},${height - padY}`;
        const gradId = 'grad_' + strokeColor.replace('#', '');

        return `
          <div class="w-full overflow-hidden">
            <svg viewBox="0 0 ${width} ${height}" class="w-full h-44 sm:h-52 overflow-visible">
              <defs>
                <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="${strokeColor}" stop-opacity="0.32" />
                  <stop offset="100%" stop-color="${strokeColor}" stop-opacity="0.0" />
                </linearGradient>
              </defs>

              <!-- Horizontal Grid Lines -->
              <line x1="${padX}" y1="${padY}" x2="${width - padX}" y2="${padY}" stroke="#334155" stroke-dasharray="4 4" stroke-width="1" />
              <line x1="${padX}" y1="${height / 2}" x2="${width - padX}" y2="${height / 2}" stroke="#334155" stroke-dasharray="4 4" stroke-width="1" />
              <line x1="${padX}" y1="${height - padY}" x2="${width - padX}" y2="${height - padY}" stroke="#334155" stroke-width="1" />

              <!-- Y-Axis Labels -->
              <text x="${padX - 8}" y="${padY + 4}" text-anchor="end" fill="#94a3b8" font-size="11" font-family="monospace">${maxVal}</text>
              <text x="${padX - 8}" y="${height - padY + 4}" text-anchor="end" fill="#94a3b8" font-size="11" font-family="monospace">${minVal}</text>

              <!-- Area Fill -->
              <polygon points="${areaPoints}" fill="url(#${gradId})" />

              <!-- Line -->
              <polyline fill="none" stroke="${strokeColor}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${polylinePoints}" />

              <!-- Data Points & Labels -->
              ${coords.map(c => `
                <circle cx="${c.x}" cy="${c.y}" r="4.5" fill="#0f172a" stroke="${strokeColor}" stroke-width="2.5" />
                <text x="${c.x}" y="${c.y - 10}" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold" font-family="monospace">${c.value}</text>
                <text x="${c.x}" y="${height - 6}" text-anchor="middle" fill="#94a3b8" font-size="10">${c.label}</text>
              `).join('')}
            </svg>
          </div>
        `;
      }

      renderMuscleVolumeBars(muscleVolume) {
        const keyMuscles = ['Chest', 'Back', 'Shoulders', 'Quads', 'Hamstrings', 'Biceps', 'Triceps'];
        return `
          <div class="space-y-3">
            ${keyMuscles.map(m => {
              const sets = muscleVolume[m] || 0;
              const pct = Math.min(100, Math.round((sets / 16) * 100));
              return `
                <div>
                  <div class="flex justify-between text-xs font-semibold mb-1">
                    <span class="text-slate-200">${m}</span>
                    <span class="font-mono ${sets >= 10 ? 'text-emerald-400' : 'text-slate-400'}">${sets} sets</span>
                  </div>
                  <div class="w-full h-2.5 bg-slate-900 rounded-full overflow-hidden">
                    <div class="h-full rounded-full transition-all ${sets >= 10 ? 'bg-emerald-400' : 'bg-sky-400'}" style="width: ${pct}%"></div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      // --- 6. VIEW 4: HISTORY LOG ---
      renderHistoryView() {
        const sorted = [...this.state.history].sort((a, b) => new Date(b.date) - new Date(a.date));

        return `
          <div class="space-y-6">
            <div class="flex items-center justify-between">
              <div>
                <h1 class="text-2xl font-extrabold text-white">Workout History</h1>
                <p class="text-sm text-slate-400">${sorted.length} completed sessions logged</p>
              </div>
            </div>

            ${sorted.length === 0 ? `
              <div class="bg-slate-800/60 border border-slate-700/60 rounded-3xl p-10 text-center space-y-3">
                <p class="text-slate-300 font-semibold">No completed workouts yet.</p>
                <button onclick="app.switchTab('workout')" class="px-5 py-2.5 rounded-xl bg-emerald-500 text-slate-950 font-bold text-sm">Start Your First Workout</button>
              </div>
            ` : `
              <div class="space-y-4">
                ${sorted.map(workout => {
                  let totalVolume = 0;
                  let totalSets = 0;
                  workout.exercises.forEach(ex => {
                    ex.sets.forEach(s => {
                      totalVolume += (Number(s.weight) || 0) * (Number(s.reps) || 0);
                      totalSets++;
                    });
                  });

                  const dateObj = new Date(workout.date);
                  const dateFormatted = dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });

                  return `
                    <div class="bg-slate-800/85 border border-slate-700/80 rounded-2xl p-5 shadow-md">
                      <div class="flex flex-wrap items-start justify-between gap-2 pb-3 border-b border-slate-700/60">
                        <div>
                          <div class="text-xs font-semibold text-emerald-400">${dateFormatted}</div>
                          <h3 class="text-base sm:text-lg font-bold text-white mt-0.5">${workout.name}</h3>
                        </div>
                        <div class="flex items-center gap-3 text-xs font-mono">
                          <div class="bg-slate-900 px-2.5 py-1.5 rounded-lg border border-slate-800">
                            <span class="text-slate-400">Vol:</span> <span class="text-white font-bold">${totalVolume.toLocaleString()} kg</span>
                          </div>
                          <div class="bg-slate-900 px-2.5 py-1.5 rounded-lg border border-slate-800">
                            <span class="text-slate-400">Time:</span> <span class="text-sky-400 font-bold">${Math.round(workout.durationSec / 60)}m</span>
                          </div>
                        </div>
                      </div>

                      <div class="mt-3 space-y-2">
                        ${workout.exercises.map(exItem => {
                          const ex = this.getExercise(exItem.exerciseId);
                          const bestSet = exItem.sets.reduce((best, s) => (s.weight * s.reps > best.weight * best.reps ? s : best), exItem.sets[0]);
                          return `
                            <div class="flex items-center justify-between text-xs sm:text-sm">
                              <span class="text-slate-300 font-medium truncate pr-2">
                                <span class="text-slate-500 font-mono mr-1.5">${exItem.sets.length}×</span>${ex.name}
                              </span>
                              <span class="font-mono text-slate-400 shrink-0">
                                Top: <span class="text-slate-200 font-semibold">${bestSet.weight}kg × ${bestSet.reps}</span>
                              </span>
                            </div>
                          `;
                        }).join('')}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>
        `;
      }

      // --- 7. MODALS (Weight, Add Exercise, Create Routine, Settings) ---

        const container = document.getElementById('modal-container');
        const box = document.getElementById('modal-box');
        box.innerHTML = htmlContent;
        container.classList.remove('hidden');
      }

      closeModal() {
        document.getElementById('modal-container').classList.add('hidden');
      }

      openWeightModal() {
        const latest = this.state.bodyWeights.length ? this.state.bodyWeights[this.state.bodyWeights.length - 1].weight : 80.0;
        this.openModal(`
          <div class="p-6 space-y-4">

              <h3 class="text-lg font-bold text-white">Log Body Weight</h3>

      }

      openAddExerciseToActiveModal() {
        this.openModal(`
          <div class="p-6 flex flex-col max-h-[85vh]">
            <div class="flex items-center justify-between pb-3 border-b border-slate-700">
              <h3 class="text-lg font-bold text-white">Add Exercise</h3>

            <div class="overflow-y-auto py-3 space-y-2">
              ${this.state.exercises.map(ex => `
                <button onclick="app.addExerciseToActive('${ex.id}')" class="w-full text-left p-3 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 flex items-center justify-between transition">

        this.state.activeSession.exercises.push({
          exerciseId,
          targetReps: '8-12',
          sets: [
            { weight: prevSet ? prevSet.weight : '', reps: prevSet ? prevSet.reps : '', rpe: 8, done: false },
            { weight: prevSet ? prevSet.weight : '', reps: prevSet ? prevSet.reps : '', rpe: 8, done: false },
            { weight: prevSet ? prevSet.weight : '', reps: prevSet ? prevSet.reps : '', rpe: 8, done: false }
          ]
        });

        this.closeModal();

      openAddExerciseToDayModal(dayId) {
