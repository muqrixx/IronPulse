      addExerciseToDay(dayId, exerciseId) {
        const sets = parseInt(document.getElementById('day-ex-sets').value, 10) || 3;
        const reps = document.getElementById('day-ex-reps').value.trim() || '8-12';
        const split = this.getActiveSplit();
        const day = split.days.find(d => d.id === dayId);
        if (day) {
          day.exercises.push({ exerciseId, targetSets: sets, targetReps: reps });
          this.saveState();
          this.closeModal();
          this.renderCurrentView();
          this.showToast('Exercise added to routine.');
        }
      }

      openCreateExerciseModal() {
        this.openModal(`
          <div class="p-6 space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="text-lg font-bold text-white">Create Custom Exercise</h3>
              <button onclick="app.closeModal()" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <div>
              <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Exercise Name</label>
              <input id="new-ex-name" type="text" placeholder="e.g. Hack Squat" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-400" />
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Muscle Group</label>
                <select id="new-ex-muscle" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white">
                  ${['Chest', 'Back', 'Shoulders', 'Quads', 'Hamstrings', 'Biceps', 'Triceps', 'Calves', 'Core'].map(m => `<option value="${m}">${m}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Equipment</label>
                <select id="new-ex-equip" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white">
                  ${['Barbell', 'Dumbbell', 'Machine', 'Cable', 'Bodyweight'].map(eq => `<option value="${eq}">${eq}</option>`).join('')}
                </select>
              </div>
            </div>
            <button onclick="app.saveCustomExercise()" class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm">
              Save Exercise
            </button>
          </div>
        `);
      }

      saveCustomExercise() {
        const name = document.getElementById('new-ex-name').value.trim();
        const muscle = document.getElementById('new-ex-muscle').value;
        const equipment = document.getElementById('new-ex-equip').value;
        if (!name) {
          this.showToast('Enter an exercise name.');
          return;
        }
        this.state.exercises.unshift({
          id: 'ex_custom_' + Date.now(),
          name,
          muscle,
          equipment
        });
        this.saveState();
        this.closeModal();
        this.renderCurrentView();
        this.showToast(`Added "${name}" to library!`);
      }

      openCreateSplitModal() {
        this.openModal(`
          <div class="p-6 space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="text-lg font-bold text-white">New Custom Split</h3>
              <button onclick="app.closeModal()" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <div>
              <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Split Name</label>
              <input id="new-split-name" type="text" placeholder="e.g. Arnold Split (Chest/Back, Shoulders/Arms, Legs)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-400" />
            </div>
            <div>
              <label class="block text-xs font-bold uppercase text-slate-400 mb-1">First Day Name</label>
              <input id="new-split-day1" type="text" placeholder="e.g. Day 1: Chest & Back" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-400" />
            </div>
            <button onclick="app.saveCustomSplit()" class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm">
              Create Split
            </button>
          </div>
        `);
      }

      saveCustomSplit() {
        const name = document.getElementById('new-split-name').value.trim();
        const day1 = document.getElementById('new-split-day1').value.trim() || 'Day 1';
        if (!name) {
          this.showToast('Please enter a split name.');
          return;
        }
        const newSplitId = 'split_' + Date.now();
        const newDayId = 'day_' + Date.now();
        this.state.splits.push({
          id: newSplitId,
          name,
          description: 'Custom user split',
          days: [
            {
              id: newDayId,
              name: day1,
              exercises: [
                { exerciseId: 'ex_bench', targetSets: 3, targetReps: '8-10' },
                { exerciseId: 'ex_lat_pulldown', targetSets: 3, targetReps: '8-12' }
              ]
            }
          ]
        });
        this.state.activeSplitId = newSplitId;
        this.state.selectedDayId = newDayId;
        this.saveState();
        this.closeModal();
        this.renderCurrentView();
        this.showToast('Custom split created!');
      }

      openAddDayModal() {
        this.openModal(`
          <div class="p-6 space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="text-lg font-bold text-white">Add Workout Day</h3>
              <button onclick="app.closeModal()" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <div>
              <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Day Title</label>
              <input id="new-day-title" type="text" placeholder="e.g. Arms & Weak Points" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-400" />
            </div>
            <button onclick="app.saveNewDay()" class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm">
              Add Day
            </button>
          </div>
        `);
      }

      saveNewDay() {
        const title = document.getElementById('new-day-title').value.trim();
        if (!title) return;
        const split = this.getActiveSplit();
        split.days.push({
          id: 'day_' + Date.now(),
          name: title,
          exercises: [
            { exerciseId: 'ex_ez_curl', targetSets: 3, targetReps: '10-12' },
            { exerciseId: 'ex_tricep_push', targetSets: 3, targetReps: '10-12' }
          ]
        });
        this.saveState();
        this.closeModal();
        this.renderCurrentView();
        this.showToast('Workout day added.');
      }

      openSettingsModal() {
        this.openModal(`
          <div class="p-6 space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="text-lg font-bold text-white">Data & Preferences</h3>
              <button onclick="app.closeModal()" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <p class="text-xs text-slate-400 leading-relaxed">
              All workouts, PRs, custom routines, and body weight logs are saved locally in your browser.
            </p>
            <div class="space-y-2.5 pt-2">
              <button onclick="app.clearSampleHistory()" class="w-full py-3 px-4 rounded-xl bg-amber-500/15 hover:bg-amber-500/25 border border-amber-500/30 text-amber-300 text-xs sm:text-sm font-bold text-left flex items-center justify-between">
                <span>Clear History & Start Fresh</span>
                <span>→</span>
              </button>
              <button onclick="app.resetToDemoData()" class="w-full py-3 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs sm:text-sm font-semibold text-left flex items-center justify-between">
                <span>Restore Sample Demo Data</span>
                <span>↺</span>
              </button>
            </div>
          </div>
        `);
      }

      clearSampleHistory() {
        this.state.history = [];
        this.state.bodyWeights = [];
        this.saveState();
        this.closeModal();
        this.renderCurrentView();
        this.showToast('History cleared. Ready for your own logs!');
      }

      resetToDemoData() {
        localStorage.removeItem(STORAGE_KEY);
        this.state = this.loadState();
        this.saveState();
        this.closeModal();
        this.renderCurrentView();
        this.showToast('Sample data restored.');
      }
    }

    // Close modal when clicking backdrop
    document.getElementById('modal-container').addEventListener('click', (e) => {
      if (e.target.id === 'modal-container') {
        window.app.closeModal();
      }
    });

    // Boot application on load
    window.onload = function() {
      window.app = new GymApp();
    };
  </script>
</body>
</html>
