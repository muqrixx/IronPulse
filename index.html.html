<!DOCTYPE html>
<html lang="en" class="dark">
<head>

  <title>IronPulse — Commercial Gym & Squad Progression Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase Compat SDKs (Works standalone on GitHub Pages with zero build tools) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            zinc: { 850: '#1c1c21', 950: '#09090b' }
          }
        }
      }
    };
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #09090b;
      color: #fafafa;
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
    }
    /* Custom subtle scrollbars */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #121215; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 9999px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 20px rgba(249, 115, 22, 0.22); }
      50% { box-shadow: 0 0 34px rgba(245, 158, 11, 0.42); }
    }
    .rank-glow { animation: pulseGlow 3s infinite ease-in-out; }
    @keyframes popIn {
      0% { transform: scale(0.88); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .pop-in { animation: popIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="min-h-screen pb-24 selection:bg-orange-500/30 selection:text-orange-200">

    <div class="max-w-2xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5">
        <button onclick="openAvatarPickerModal()" title="Change Animal Avatar" id="headerAvatarBtn" class="w-10 h-10 rounded-xl bg-zinc-900 border border-orange-500/40 flex items-center justify-center shadow-lg shadow-orange-500/10 hover:scale-105 transition overflow-hidden shrink-0">

        </button>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-extrabold tracking-tight text-base text-white leading-none">IRON<span class="text-orange-500">PULSE</span></h1>
            <span id="cloudStatusBadge" onclick="switchTab('squad')" class="cursor-pointer inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-zinc-900 text-zinc-400 border border-zinc-800">

     * ============================================================================
     */
    function getAllExercises() {
      return [...EXERCISE_DB, ...(appState.customExercises || [])];
    }

    function getExerciseById(id) {
      return getAllExercises().find(e => e.id === id) || { id, name: 'Unknown Exercise', muscle: 'Other', equipment: 'Gym', cue: '' };
    }

    function calcE1RM(weight, reps) {
      const w = parseFloat(weight) || 0;
      const r = parseInt(reps, 10) || 0;
      if (w <= 0 || r <= 0) return 0;
      if (r === 1) return Math.round(w * 10) / 10;
      return Math.round(w * (1 + r / 30) * 10) / 10;
    }

    function getWorkoutVolume(workout) {
      let vol = 0;
      (workout.exercises || []).forEach(ex => {
        (ex.sets || []).forEach(s => {
          vol += (parseFloat(s.weight) || 0) * (parseInt(s.reps, 10) || 0);
        });
      });
      return Math.round(vol);
    }

    function getWorkoutSetsCount(workout) {
      let count = 0;
      (workout.exercises || []).forEach(ex => { count += (ex.sets || []).length; });
      return count;
    }

    function getTotalVolume(state = appState) {
      return state.workouts.reduce((sum, w) => sum + getWorkoutVolume(w), 0);
    }

    function getTotalSets(state = appState) {
      return state.workouts.reduce((sum, w) => sum + getWorkoutSetsCount(w), 0);
    }

    function getWeeklyWorkouts(state = appState) {
      const cutoff = Date.now() - 7 * 86400000;
      return state.workouts.filter(w => w.date >= cutoff);
    }

    function getWeeklyVolume(state = appState) {
      return getWeeklyWorkouts(state).reduce((sum, w) => sum + getWorkoutVolume(w), 0);
    }

    function getTodayWorkouts(state = appState) {
      const startOfDay = new Date();
      startOfDay.setHours(0, 0, 0, 0);
      return state.workouts.filter(w => w.date >= startOfDay.getTime());
    }

    function getTodayBodyWeights(state = appState) {
      const startOfDay = new Date();
      startOfDay.setHours(0, 0, 0, 0);
      return (state.bodyWeights || []).filter(b => b.date >= startOfDay.getTime());
    }

    function getTodaySets(state = appState) {
      return getTodayWorkouts(state).reduce((sum, w) => sum + getWorkoutSetsCount(w), 0);
    }

    function computeAllPRs(state = appState) {
      const prs = {};
      state.workouts.forEach(w => {
        (w.exercises || []).forEach(ex => {
          (ex.sets || []).forEach(s => {
            const e1rm = calcE1RM(s.weight, s.reps);
            if (e1rm > 0 && (!prs[ex.exerciseId] || e1rm > prs[ex.exerciseId].e1rm)) {
              prs[ex.exerciseId] = { e1rm, weight: s.weight, reps: s.reps, date: w.date };
            }
          });
        });
      });
      return prs;
    }

    function getTopLiftsSummary(state = appState) {
      const prs = computeAllPRs(state);
      const priorityIds = ['ex_bench_flat', 'ex_squat', 'ex_deadlift', 'ex_ohp_bb', 'ex_leg_press'];
      const results = [];
      priorityIds.forEach(id => {
        if (prs[id]) {
          const ex = getExerciseById(id);
          results.push({
            id,
            name: ex.name.replace('Barbell ', '').replace('45° Commercial ', ''),
            weight: prs[id].weight,
            reps: prs[id].reps,
            e1rm: prs[id].e1rm
          });
        }
      });
      if (results.length < 3) {
        Object.entries(prs)
          .sort((a, b) => b[1].e1rm - a[1].e1rm)
          .forEach(([id, data]) => {
            if (results.length < 3 && !results.find(r => r.id === id)) {
              results.push({
                id,
                name: getExerciseById(id).name,
                weight: data.weight,
                reps: data.reps,
                e1rm: data.e1rm
              });
            }
          });
      }
      return results.slice(0, 3);
    }

    function calculateTotalXP(state = appState) {
      let xp = state.bonusXp || 0;
      xp += state.workouts.length * 250;
      xp += getTotalSets(state) * 15;
      xp += Math.floor(getTotalVolume(state) / 100);
      xp += Object.keys(computeAllPRs(state)).length * 75;
      return xp;
    }

    function getRankForXP(xp) {
      let current = RANK_TIERS[0];
      let next = RANK_TIERS[1] || null;
      for (let i = 0; i < RANK_TIERS.length; i++) {
        if (xp >= RANK_TIERS[i].minXp) {
          current = RANK_TIERS[i];
          next = RANK_TIERS[i + 1] || null;
        }
      }
      const progressPct = next
        ? Math.min(100, Math.max(0, Math.round(((xp - current.minXp) / (next.minXp - current.minXp)) * 100)))
        : 100;
      return { current, next, progressPct };
    }

    function getLastExercisePerformance(exerciseId) {
      const sorted = [...appState.workouts].sort((a, b) => b.date - a.date);
      for (const w of sorted) {
        const found = (w.exercises || []).find(e => e.exerciseId === exerciseId);
        if (found && found.sets && found.sets.length > 0) {
          const best = found.sets.reduce((top, s) => (s.weight > top.weight ? s : top), found.sets[0]);
          return `${best.weight}kg × ${best.reps}`;
        }
      }
      return null;
    }

     * 7. FIREBASE CLOUD SYNC ENGINE (REAL-TIME SQUAD & LEADERBOARD)
     * ============================================================================
     */
    function parseFirebaseConfigInput(rawInput) {
      if (!rawInput || typeof rawInput !== 'string') return null;
      const trimmed = rawInput.trim();
      if (!trimmed) return null;

      try {
        const direct = JSON.parse(trimmed);
        if (direct && direct.apiKey && direct.projectId) return direct;
      } catch (_) {}

      const keys = ['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId', 'measurementId'];
      const extracted = {};
      keys.forEach(k => {
        const regex = new RegExp(`["']?${k}["']?\\s*:\\s*["']([^"']+)["']`, 'i');
        const match = trimmed.match(regex);
        if (match && match[1]) extracted[k] = match[1].trim();
      });

      if (extracted.apiKey && extracted.projectId) {
        return extracted;
      }
      return null;
    }

    function getStoredCloudConfig() {
      try {
        const saved = localStorage.getItem(CLOUD_CFG_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.apiKey && parsed.projectId) return parsed;
        }
      } catch (_) {}

      if (DEFAULT_FIREBASE_CONFIG && DEFAULT_FIREBASE_CONFIG.apiKey && DEFAULT_FIREBASE_CONFIG.projectId) {
        return DEFAULT_FIREBASE_CONFIG;
      }
      return null;
    }

    function checkInviteUrlParam() {
      try {
        const params = new URLSearchParams(window.location.search);
        const squadParam = params.get('squad');
        if (squadParam && squadParam.trim().length >= 2) {
          const cleanCode = squadParam.trim().toUpperCase().replace(/[^A-Z0-9-_]/g, '');
          if (cleanCode && cleanCode !== appState.squadCode) {
            appState.squadCode = cleanCode;
            saveState(false);
            showToast(`Joined Squad Room: ${cleanCode}`, 'orange');
          }
        }
      } catch (_) {}
    }

    async function initFirebaseCloud(configObj, silent = false) {
      const cfg = configObj || getStoredCloudConfig();
      if (!cfg || !cfg.apiKey || !cfg.projectId) {
        cloudState.connected = false;
        updateCloudStatusUI();
        return false;
      }

      if (typeof firebase === 'undefined') {
        cloudState.error = 'Firebase SDK failed to load. Check internet connection.';
        updateCloudStatusUI();
        return false;
      }

      cloudState.connecting = true;
      cloudState.error = null;
      updateCloudStatusUI();

      try {
        let app;
        if (firebase.apps && firebase.apps.length > 0) {
          app = firebase.apps[0];
        } else {
          app = firebase.initializeApp(cfg);
        }

        cloudState.auth = firebase.auth();
        cloudState.db = firebase.firestore();

        if (!cloudState.auth.currentUser) {
          await cloudState.auth.signInAnonymously();
        }

        localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(cfg));
        cloudState.connected = true;
        cloudState.connecting = false;
        cloudState.error = null;

        updateCloudStatusUI();
        await syncMemberProfileToCloud();
        attachSquadListeners();

        if (!silent) {
          showToast(`Connected to Squad: ${appState.squadCode}`, 'orange');
        }
        return true;
      } catch (err) {
        console.error('Firebase init error:', err);
        cloudState.connected = false;
        cloudState.connecting = false;
        cloudState.error = err.message || 'Could not connect to Firebase.';
        updateCloudStatusUI();
        if (!silent) {
          showToast('Cloud connection error: ' + cloudState.error, 'rose');
        }
        return false;
      }
    }

    function detachSquadListeners() {
      if (cloudState.unsubMembers) {
        cloudState.unsubMembers();
        cloudState.unsubMembers = null;
      }
      if (cloudState.unsubFeed) {
        cloudState.unsubFeed();
        cloudState.unsubFeed = null;
      }
    }

    function attachSquadListeners() {
      if (!cloudState.connected || !cloudState.db) return;
      detachSquadListeners();

      const squadCode = (appState.squadCode || 'IRON-SQUAD').toUpperCase();

      cloudState.unsubMembers = cloudState.db
        .collection('squads')
        .doc(squadCode)
        .collection('members')
        .onSnapshot(
          (snapshot) => {
            const list = [];
            snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
            cloudState.members = list;
            if (activeTab === 'squad' || activeTab === 'home') renderApp();
          },
          (err) => {
            console.error('Members snapshot error:', err);
            cloudState.error = 'Firestore permission error. Check Firestore security rules.';
            updateCloudStatusUI();
          }
        );

      cloudState.unsubFeed = cloudState.db
        .collection('squads')
        .doc(squadCode)
        .collection('feed')
        .onSnapshot(
          (snapshot) => {
            const items = [];
            snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
            items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            cloudState.feed = items.slice(0, 25);
            if (activeTab === 'squad') renderApp();
          },
          (err) => {
            console.error('Feed snapshot error:', err);
          }
        );
    }

    async function syncMemberProfileToCloud() {
      if (!cloudState.connected || !cloudState.db) return;
      try {
        const squadCode = (appState.squadCode || 'IRON-SQUAD').toUpperCase();
        const xp = calculateTotalXP();
        const rankInfo = getRankForXP(xp);
        const prs = computeAllPRs();
        const latestWorkout = [...appState.workouts].sort((a, b) => b.date - a.date)[0];
        const latestBw = appState.bodyWeights && appState.bodyWeights.length
          ? appState.bodyWeights[appState.bodyWeights.length - 1].weight
          : null;

        const payload = {
          athleteId: appState.athleteId,
          name: appState.athleteName || 'Athlete',
          avatarId: appState.avatarId || 'shiba',
          squadCode,
          xp,
          rankTier: rankInfo.current.tier,
          rankName: rankInfo.current.name,
          rankIcon: rankInfo.current.icon,
          rankProgressPct: rankInfo.progressPct,
          totalWorkouts: appState.workouts.length,
          weeklyWorkouts: getWeeklyWorkouts().length,
          weeklyVolume: getWeeklyVolume(),
          totalVolume: getTotalVolume(),
          totalSets: getTotalSets(),
          prCount: Object.keys(prs).length,
          bodyWeight: latestBw,
          topLifts: getTopLiftsSummary(),
          lastWorkoutName: latestWorkout ? latestWorkout.dayName : 'No workouts yet',
          lastWorkoutDate: latestWorkout ? latestWorkout.date : null,
          updatedAt: Date.now()
        };

        await cloudState.db
          .collection('squads')
          .doc(squadCode)
          .collection('members')
          .doc(appState.athleteId)
          .set(payload, { merge: true });

        cloudState.lastSyncedAt = Date.now();
        updateCloudStatusUI();
      } catch (err) {
        console.error('Sync profile error:', err);
      }
    }

    async function toggleFeedKudos(eventId) {
      if (!cloudState.connected || !cloudState.db) {
        showToast('Connect Cloud Sync to send Fist Bumps!', 'amber');
        return;
      }
      const item = cloudState.feed.find(f => f.id === eventId);

          .collection('feed')
          .doc(eventId)

    /**

     * 8. UI HELPERS, AUDIO CHIME, TOASTS & CLIPBOARD

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function timeAgo(timestamp) {
      if (!timestamp) return 'Just now';
      const diff = Math.max(0, Date.now() - timestamp);
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return 'Just now';
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      const days = Math.floor(hrs / 24);
      return `${days}d ago`;
    }

    function formatDuration(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function copyTextFallback(text, successMsg = 'Copied to clipboard!') {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast(successMsg, 'orange');
      } catch (e) {
        showToast('Could not copy automatically. Please select and copy.', 'amber');
      }
      document.body.removeChild(ta);
    }

    function showToast(message, tone = 'orange') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const colors = {
        orange: 'bg-zinc-900/95 border-orange-500/60 text-orange-200',
        amber: 'bg-zinc-900/95 border-amber-500/60 text-amber-200',
        rose: 'bg-zinc-900/95 border-rose-500/60 text-rose-200'
      };
      const el = document.createElement('div');
      el.className = `pop-in pointer-events-auto px-4 py-2.5 rounded-xl border shadow-xl text-xs font-bold flex items-center justify-between gap-2 ${colors[tone] || colors.orange}`;
      el.innerHTML = `<span>${escapeHtml(message)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s';
        setTimeout(() => el.remove(), 260);
      }, 3000);
    }

    function playRestChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const notes = [587.33, 880];
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.16);
          gain.gain.setValueAtTime(0.18, ctx.currentTime + i * 0.16);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.16 + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.16);
          osc.stop(ctx.currentTime + i * 0.16 + 0.36);
        });
      } catch (_) {}
    }

    /* ------------------------- TAB 2: WORKOUT SPLITS ------------------------- */
    function renderWorkoutsTab() {
      return `
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-lg font-black text-white">Commercial Gym Splits</h2>

          </div>
          <button onclick="openCustomExerciseModal()" class="px-3 py-2 rounded-xl bg-zinc-900 border border-zinc-700 text-xs font-bold text-orange-400 hover:bg-zinc-850 transition shrink-0">

          </button>
        </div>

        <div class="space-y-4">
          ${appState.splits.map(split => {
            const isSelected = split.id === appState.activeSplitId;
            return `
              <div class="rounded-2xl bg-zinc-900 border ${isSelected ? 'border-orange-500/60 shadow-lg shadow-orange-500/5' : 'border-zinc-800'} p-4 transition">

                  <div>
                    <div class="flex items-center gap-2 flex-wrap">
                      <h3 class="text-base font-extrabold text-white">${escapeHtml(split.name)}</h3>

                    <p class="text-xs text-zinc-400 mt-1">${escapeHtml(split.description)}</p>
                  </div>
                  <div class="flex items-center gap-1.5 shrink-0">
                    ${!isSelected ? `<button onclick="setActiveSplit('${split.id}')" class="px-2.5 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-[11px] font-bold text-zinc-200">Activate</button>` : ''}
                    <button onclick="cloneSplit('${split.id}')" title="Clone & Customize" class="p-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-bold">
                      Clone
                    </button>
                  </div>
                </div>

                <!-- Days inside this split -->
                <div class="mt-3 space-y-2">
                  ${split.days.map(day => `
                    <div class="rounded-xl bg-zinc-950/90 border border-zinc-800/90 p-3 flex items-center justify-between gap-2">
                      <div class="min-w-0">
                        <p class="text-xs font-extrabold text-zinc-100 truncate">${escapeHtml(day.name)}</p>
                        <p class="text-[11px] text-zinc-400 truncate mt-0.5">
                          ${day.exercises.map(e => getExerciseById(e.exerciseId).name).join(' • ')}
                        </p>
                      </div>
                      <div class="flex items-center gap-1.5 shrink-0">
                        <button onclick="openEditSplitDayModal('${split.id}', '${day.id}')" class="px-2.5 py-1.5 rounded-lg bg-zinc-900 border border-zinc-700 text-[11px] font-bold text-zinc-300 hover:text-white">
                          Edit
                        </button>
                        <button onclick="startWorkoutSession('${split.id}', '${day.id}')" class="px-3 py-1.5 rounded-lg bg-orange-500 text-zinc-950 text-xs font-black hover:bg-orange-400 transition">
                          Start
                        </button>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function setActiveSplit(splitId) {
      appState.activeSplitId = splitId;
      saveState(false);
      showToast('Active split updated!', 'orange');
      renderApp();
    }

    function cloneSplit(splitId) {
      const orig = appState.splits.find(s => s.id === splitId);
      if (!orig) return;
      const copy = JSON.parse(JSON.stringify(orig));
      copy.id = 'split_custom_' + Date.now();
      copy.name = orig.name + ' (Custom)';
      copy.badge = 'Custom';
      appState.splits.unshift(copy);
      appState.activeSplitId = copy.id;
      saveState(false);
      showToast('Cloned split! Tap Edit on any day to customize.', 'amber');
      renderApp();
    }

    /* ------------------------- TAB 3: CLOUD SQUAD & LEADERBOARD ------------------------- */
    function renderSquadTab() {
      const sortedMembers = [...cloudState.members].sort((a, b) => {
        if (squadSortBy === 'weeklyVolume') return (b.weeklyVolume || 0) - (a.weeklyVolume || 0);
        if (squadSortBy === 'weeklyWorkouts') return (b.weeklyWorkouts || 0) - (a.weeklyWorkouts || 0);
        if (squadSortBy === 'prCount') return (b.prCount || 0) - (a.prCount || 0);
        return (b.xp || 0) - (a.xp || 0);
      });

      const top3 = sortedMembers.slice(0, 3);

      return `

        <section class="rounded-2xl bg-gradient-to-br from-zinc-900 via-zinc-900 to-orange-950/25 border border-zinc-800 p-4">

                <div class="flex items-center gap-2">
                  <h2 class="text-lg font-black text-white">Squad Leaderboard</h2>

                    ${cloudState.connected ? '● LIVE SYNC' : '○ OFFLINE'}

                </div>
                <p class="text-xs text-zinc-400 mt-0.5">
                  Room: <span class="text-amber-400 font-extrabold">${escapeHtml(appState.squadCode)}</span> • <span class="text-white font-bold">${escapeHtml(appState.athleteName)}</span>
                </p>
              </div>
            </div>
            <button onclick="openSquadSetupModal()" class="px-3 py-1.5 rounded-xl bg-zinc-850 hover:bg-zinc-800 border border-zinc-700 text-xs font-bold text-zinc-200 transition shrink-0">
              ${cloudState.connected ? 'Settings' : 'Connect'}

          </div>

          <!-- Action Buttons Row -->
          <div class="grid grid-cols-2 gap-2 mt-3.5">
            <button onclick="shareSquadInvite()" class="py-2.5 px-3 rounded-xl bg-gradient-to-r from-orange-500 to-amber-500 text-zinc-950 text-xs font-black flex items-center justify-center gap-1.5 shadow-md shadow-orange-500/15 hover:brightness-110 transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
              Invite Friends Link
            </button>
            <button onclick="manualCloudSync()" class="py-2.5 px-3 rounded-xl bg-zinc-850 hover:bg-zinc-800 border border-zinc-700 text-xs font-extrabold text-white flex items-center justify-center gap-1.5 transition">
              <svg class="w-4 h-4 text-orange-400" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
              ${cloudState.connected ? 'Sync Now' : 'Setup Firebase'}
            </button>
          </div>
        </section>

        ${!cloudState.connected ? `
          <!-- ONBOARDING CARD WHEN FIREBASE IS NOT CONFIGURED YET -->
          <section class="rounded-2xl bg-zinc-900 border border-orange-500/30 p-5 space-y-3">
            <div class="flex items-center gap-3">
              <div class="w-11 h-11 rounded-2xl bg-orange-500/15 border border-orange-500/30 flex items-center justify-center text-2xl">☁️</div>
              <div>
                <h3 class="text-base font-black text-white">Enable Automatic Friend Sync</h3>
                <p class="text-xs text-zinc-400">Free Google Firebase Firestore backend — updates live whenever any friend finishes a workout.</p>
              </div>
            </div>
            <ol class="text-xs text-zinc-300 space-y-2 bg-zinc-950/90 border border-zinc-800 rounded-xl p-3.5 list-decimal list-inside">
              <li>Go to <span class="text-amber-400 font-bold">console.firebase.google.com</span> and create a free project.</li>
              <li>Enable <span class="text-orange-400 font-bold">Authentication → Anonymous</span> and <span class="text-orange-400 font-bold">Firestore Database</span> (Start in test mode).</li>
              <li>Copy your <code class="text-amber-300">firebaseConfig</code> snippet from Project Settings and paste it below!</li>
            </ol>
            <button onclick="openSquadSetupModal()" class="w-full py-3 rounded-xl bg-gradient-to-r from-orange-500 to-amber-500 text-zinc-950 font-black text-sm shadow-lg">
              Paste Firebase Config & Join Squad
            </button>
          </section>
        ` : `
          <!-- LEADERBOARD SORT FILTER TABS -->
          <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
            ${[
              { id: 'xp', label: '⚡ Total XP' },
              { id: 'weeklyVolume', label: '🏋️ Weekly Volume' },
              { id: 'weeklyWorkouts', label: '🔥 Weekly Sessions' },
              { id: 'prCount', label: '🏆 Total PRs' }
            ].map(tab => `
              <button onclick="setSquadSort('${tab.id}')" class="px-3 py-1.5 rounded-xl text-xs font-extrabold whitespace-nowrap border transition ${squadSortBy === tab.id ? 'bg-orange-500/20 border-orange-500/50 text-orange-300' : 'bg-zinc-900 border-zinc-800 text-zinc-400 hover:text-white'}">
                ${tab.label}

                          #${idx + 1}
                        </span>
                      </div>
                      <div>
                        <div class="flex items-center gap-1.5">
                          <span class="text-sm font-black text-white">${escapeHtml(m.name)}</span>
                          ${isMe ? '<span class="px-1.5 py-0.5 rounded text-[9px] font-black bg-orange-500/20 text-orange-300">YOU</span>' : ''}
                        </div>
                        <p class="text-xs font-semibold text-amber-400">${m.rankIcon || '🔩'} ${escapeHtml(m.rankName || 'Iron Novice')}</p>
                      </div>

                    <div class="text-right">
                      <p class="text-sm font-black text-orange-400">${(m.xp || 0).toLocaleString()} XP</p>

              <div class="space-y-2.5">

                  const bumped = Array.isArray(evt.kudosBy) && evt.kudosBy.includes(appState.athleteId);
                  return `
                    <div class="rounded-xl bg-zinc-950/90 border border-zinc-800/90 p-3 flex items-start justify-between gap-2.5">
                      <div class="flex items-start gap-2.5 min-w-0">

                        <span>👊</span>
                        <span>${evt.kudosCount || 0}</span>
                      </button>
                    </div>

                }).join('')}
              </div>

    function renderLineChartSVG(points, strokeColor, unit) {
      if (!points || points.length === 0) {
        return `<div class="h-32 rounded-xl bg-zinc-950/80 border border-dashed border-zinc-800 flex items-center justify-center text-xs text-zinc-500">Not enough data points yet</div>`;
      }
      const w = 360, h = 120, pad = 20;
      const vals = points.map(p => p.val);
      const minV = Math.min(...vals);
      const maxV = Math.max(...vals);
      const range = maxV - minV || 1;

      const coords = points.map((p, idx) => {
        const x = points.length === 1 ? w / 2 : pad + (idx / (points.length - 1)) * (w - pad * 2);
        const y = h - pad - ((p.val - minV) / range) * (h - pad * 2);
        return { x, y, val: p.val, date: p.date };
      });

      const pathD = coords.map((c, i) => `${i === 0 ? 'M' : 'L'} ${c.x.toFixed(1)} ${c.y.toFixed(1)}`).join(' ');

      return `
        <div class="rounded-xl bg-zinc-950 border border-zinc-800/80 p-2">
          <svg viewBox="0 0 ${w} ${h}" class="w-full h-32 overflow-visible">
            <path d="${pathD}" fill="none" stroke="${strokeColor}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
            ${coords.map(c => `
              <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="4" fill="#09090b" stroke="${strokeColor}" stroke-width="2.5" />
              <text x="${c.x.toFixed(1)}" y="${(c.y - 8).toFixed(1)}" text-anchor="middle" fill="#e4e4e7" font-size="9" font-weight="700">${c.val}${unit}</text>
            `).join('')}
          </svg>
        </div>
      `;
    }

      const split = appState.splits.find(s => s.id === splitId);
      const day = split && split.days.find(d => d.id === dayId);
      if (!split || !day) return;

      activeSession = {
        splitId: split.id,
        splitName: split.name,
        dayId: day.id,
        dayName: day.name,
        startTime: Date.now(),
        elapsedSec: 0,
        exercises: day.exercises.map(item => ({
          exerciseId: item.exerciseId,
          targetReps: item.targetReps,
          restSec: item.restSec || 90,
          sets: Array.from({ length: item.targetSets || 3 }, () => ({
            weight: '',
            reps: '',
            rpe: '8',
            done: false
          }))
        }))
      };

      if (sessionTimerInterval) clearInterval(sessionTimerInterval);
      sessionTimerInterval = setInterval(() => {
        if (!activeSession) return;
        activeSession.elapsedSec = Math.floor((Date.now() - activeSession.startTime) / 1000);
        const timerEl = document.getElementById('modalSessionClock');
        if (timerEl) timerEl.textContent = formatDuration(activeSession.elapsedSec);

      openActiveWorkoutModal();

    function minimizeWorkoutModal() {

    function updateActiveSet(exIdx, setIdx, field, value) {
      if (!activeSession) return;
      activeSession.exercises[exIdx].sets[setIdx][field] = value;
    }

    function toggleActiveSetDone(exIdx, setIdx) {
      if (!activeSession) return;
      const setObj = activeSession.exercises[exIdx].sets[setIdx];
      setObj.done = !setObj.done;
      if (setObj.done) {
        startRestTimer(activeSession.exercises[exIdx].restSec || 90);
      }
      updateActiveBanner();
      openActiveWorkoutModal();
    }

    function addActiveSet(exIdx) {
      if (!activeSession) return;
      const prev = activeSession.exercises[exIdx].sets.slice(-1)[0] || { weight: '', reps: '', rpe: '8' };
      activeSession.exercises[exIdx].sets.push({ weight: prev.weight, reps: prev.reps, rpe: '8', done: false });
      openActiveWorkoutModal();
    }

    function startRestTimer(seconds) {
      stopRestTimer();
      restTimerState.remaining = seconds;
      restTimerState.total = seconds;
      restTimerState.active = true;
      const clock = document.getElementById('restTimerClock');
      if (clock) {
        clock.textContent = formatDuration(restTimerState.remaining);
        clock.classList.add('text-amber-400');
      }
      restTimerState.interval = setInterval(() => {
        restTimerState.remaining--;
        const el = document.getElementById('restTimerClock');
        if (el) el.textContent = formatDuration(Math.max(0, restTimerState.remaining));
        if (restTimerState.remaining <= 0) {
          stopRestTimer();
          playRestChime();
          showToast('Rest complete — Next set!', 'amber');
          if (document.getElementById('modalRoot').innerHTML !== '') openActiveWorkoutModal();
        }
      }, 1000);
    }

    function stopRestTimer() {
      if (restTimerState.interval) clearInterval(restTimerState.interval);
      restTimerState.active = false;
      restTimerState.interval = null;
    }

    function cancelWorkoutSession() {
      stopRestTimer();
      if (sessionTimerInterval) clearInterval(sessionTimerInterval);
      activeSession = null;
      document.getElementById('modalRoot').innerHTML = '';
      updateActiveBanner();
      showToast('Session discarded', 'amber');
    }

    async function finishWorkoutSession() {
      if (!activeSession) return;

      const cleanedExercises = [];
      activeSession.exercises.forEach(ex => {
        const validSets = ex.sets
          .filter(s => (parseFloat(s.weight) > 0 && parseInt(s.reps, 10) > 0))
          .map(s => ({
            weight: parseFloat(s.weight),
            reps: parseInt(s.reps, 10),
            rpe: parseFloat(s.rpe) || 8
          }));
        if (validSets.length > 0) {
          cleanedExercises.push({ exerciseId: ex.exerciseId, sets: validSets });
        }
      });

      if (cleanedExercises.length === 0) {
        showToast('Log at least 1 set with weight & reps before finishing!', 'amber');
        return;
      }

      const oldPRs = computeAllPRs();
      const oldRankTier = getRankForXP(calculateTotalXP()).current.tier;

      const completedWorkout = {
        id: 'w_' + Date.now(),
        splitName: activeSession.splitName,
        dayName: activeSession.dayName,
        date: Date.now(),
        durationSec: activeSession.elapsedSec || 1800,
        exercises: cleanedExercises
      };

      appState.workouts.push(completedWorkout);

      const newPRs = computeAllPRs();
      const brokenPrNames = [];
      Object.entries(newPRs).forEach(([exId, data]) => {
        if (!oldPRs[exId] || data.e1rm > oldPRs[exId].e1rm) {
          brokenPrNames.push(`${getExerciseById(exId).name} (${data.weight}kg×${data.reps})`);
        }
      });

      const vol = getWorkoutVolume(completedWorkout);
      const setsCount = getWorkoutSetsCount(completedWorkout);
      const newRankObj = getRankForXP(calculateTotalXP()).current;

      stopRestTimer();
      if (sessionTimerInterval) clearInterval(sessionTimerInterval);
      activeSession = null;
      document.getElementById('modalRoot').innerHTML = '';
      updateActiveBanner();

      saveState(true);
      showToast(`Workout Saved! +${vol.toLocaleString()} kg volume`, 'orange');

      await postSquadActivityEvent({
        type: 'workout',
        message: `Completed "${completedWorkout.dayName}" (${setsCount} sets • ${vol.toLocaleString()} kg total volume)`,
        meta: brokenPrNames.length > 0 ? `🔥 NEW PR: ${brokenPrNames[0]}` : `${completedWorkout.splitName}`
      });

      if (newRankObj.tier > oldRankTier) {
        await postSquadActivityEvent({
          type: 'rankup',
          message: `Promoted to Tier ${newRankObj.tier}: ${newRankObj.name}!`,
          meta: `Total XP: ${calculateTotalXP().toLocaleString()}`
        });
        openRankUpModal(newRankObj);
      }

      renderApp();
    }

      const name = (document.getElementById('custExName')?.value || '').trim();
      if (!name) return;
      appState.customExercises.push({
        id: 'ex_custom_' + Date.now(),
        name,
        muscle: document.getElementById('custExMuscle').value,
        equipment: document.getElementById('custExEquip').value,
        cue: document.getElementById('custExCue').value.trim()
      });
      saveState(false);
      closeModal();
      showToast(`Added "${name}" to exercise library!`, 'orange');
      renderApp();
    }

    function openEditSplitDayModal(splitId, dayId) {
      const split = appState.splits.find(s => s.id === splitId);
      const day = split && split.days.find(d => d.id === dayId);
      if (!split || !day) return;

      document.getElementById('modalRoot').innerHTML = `
        <div class="fixed inset-0 z-50 bg-zinc-950/90 overflow-y-auto flex items-center justify-center p-4">
          <div class="w-full max-w-md rounded-2xl bg-zinc-900 border border-zinc-700 p-5 space-y-3 pop-in">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-black text-white">Edit: ${escapeHtml(day.name)}</h3>
              <button onclick="closeModal()" class="text-zinc-400 hover:text-white">✕</button>
            </div>
            <div class="space-y-2 max-h-72 overflow-y-auto">
              ${day.exercises.map((item, idx) => `
                <div class="flex items-center justify-between gap-2 p-2.5 rounded-xl bg-zinc-950 border border-zinc-800">
                  <div class="min-w-0">
                    <p class="text-xs font-bold text-white truncate">${escapeHtml(getExerciseById(item.exerciseId).name)}</p>
                    <p class="text-[10px] text-zinc-400">${item.targetSets} sets × ${item.targetReps}</p>
                  </div>
                  <button onclick="removeExerciseFromDay('${splitId}', '${dayId}', ${idx})" class="px-2 py-1 rounded bg-rose-950 text-rose-300 text-[11px] font-bold">Remove</button>
                </div>
              `).join('')}
            </div>
            <div class="pt-2 border-t border-zinc-800 flex gap-2">
              <select id="addExSelect" class="flex-1 px-2.5 py-2 rounded-xl bg-zinc-950 border border-zinc-700 text-xs font-bold text-white">
                ${getAllExercises().map(e => `<option value="${e.id}">${escapeHtml(e.name)} (${e.muscle})</option>`).join('')}
              </select>
              <button onclick="addExerciseToDay('${splitId}', '${dayId}')" class="px-3 py-2 rounded-xl bg-orange-500 text-zinc-950 text-xs font-black">+ Add</button>
            </div>
          </div>
        </div>
      `;
    }

    function removeExerciseFromDay(splitId, dayId, idx) {
      const split = appState.splits.find(s => s.id === splitId);
      const day = split && split.days.find(d => d.id === dayId);
      if (!day) return;
      day.exercises.splice(idx, 1);
      saveState(false);
      openEditSplitDayModal(splitId, dayId);
      renderApp();
    }

    function addExerciseToDay(splitId, dayId) {
      const split = appState.splits.find(s => s.id === splitId);
      const day = split && split.days.find(d => d.id === dayId);
      const exId = document.getElementById('addExSelect')?.value;
      if (!day || !exId) return;
      day.exercises.push({ exerciseId: exId, targetSets: 3, targetReps: '8-12', restSec: 90 });
      saveState(false);
      openEditSplitDayModal(splitId, dayId);
      renderApp();
    }

    function openShareRankModal() {
      const xp = calculateTotalXP();
      const { current } = getRankForXP(xp);
      const topLifts = getTopLiftsSummary();
      const summaryText = `🏅 IRONPULSE ATHLETE CARD\nAthlete: ${appState.athleteName}\nRank: ${current.icon} ${current.name} (Tier ${current.tier})\nTotal XP: ${xp.toLocaleString()} XP\nLifetime Volume: ${(getTotalVolume() / 1000).toFixed(1)} tons\nSquad Room: ${appState.squadCode}`;

      document.getElementById('modalRoot').innerHTML = `
        <div class="fixed inset-0 z-50 bg-zinc-950/90 flex items-center justify-center p-4">
          <div class="w-full max-w-sm rounded-3xl bg-gradient-to-br from-zinc-900 via-zinc-900 to-orange-950/40 border border-orange-500/40 p-6 text-center space-y-4 pop-in shadow-2xl">
            <div class="flex justify-center">
              ${renderAvatarBadge(appState.avatarId, 'w-20 h-20')}
            </div>
            <div>
              <span class="px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase bg-orange-500/20 text-orange-300 border border-orange-500/40">${current.icon} Tier ${current.tier} Athlete</span>
              <h3 class="text-2xl font-black text-white mt-1.5">${current.name}</h3>
              <p class="text-xs font-bold text-zinc-400">${escapeHtml(appState.athleteName)} • ${xp.toLocaleString()} XP</p>
            </div>
            <div class="grid grid-cols-2 gap-2 text-left bg-zinc-950/80 border border-zinc-800 rounded-2xl p-3">
              <div><p class="text-[10px] text-zinc-400">Workouts</p><p class="text-sm font-black text-white">${appState.workouts.length}</p></div>
              <div><p class="text-[10px] text-zinc-400">Volume</p><p class="text-sm font-black text-amber-400">${(getTotalVolume()/1000).toFixed(1)}t</p></div>
            </div>
            ${topLifts.length > 0 ? `
              <div class="space-y-1 text-left">
                ${topLifts.map(l => `<div class="flex justify-between text-xs px-2"><span class="text-zinc-400">${escapeHtml(l.name)}</span><span class="font-black text-amber-300">${l.weight}kg × ${l.reps}</span></div>`).join('')}
              </div>
            ` : ''}
            <div class="flex gap-2">
              <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl bg-zinc-850 text-xs font-bold text-zinc-300">Close</button>
              <button onclick='copyTextFallback(${JSON.stringify(summaryText)}, "Athlete Rank Card copied!")' class="flex-1 py-2.5 rounded-xl bg-orange-500 text-zinc-950 text-xs font-black">Copy Card</button>
            </div>
          </div>
        </div>
      `;
    }

    function openRankUpModal(rankObj) {
      document.getElementById('modalRoot').innerHTML = `
        <div class="fixed inset-0 z-50 bg-zinc-950/90 flex items-center justify-center p-4">
          <div class="w-full max-w-sm rounded-3xl bg-gradient-to-b from-zinc-900 to-zinc-950 border border-amber-400/60 p-6 text-center space-y-4 pop-in">
            <p class="text-xs font-black uppercase tracking-widest text-amber-400">Rank Promotion!</p>
            <div class="w-24 h-24 mx-auto rounded-3xl bg-gradient-to-br ${rankObj.gradient} flex items-center justify-center text-5xl shadow-2xl">
              ${rankObj.icon}
            </div>
            <div>
              <h3 class="text-2xl font-black text-white">${rankObj.name}</h3>
              <p class="text-xs text-zinc-400 mt-1">Your promotion has been broadcast to Squad <span class="text-orange-400 font-bold">${escapeHtml(appState.squadCode)}</span>!</p>
            </div>
            <button onclick="closeModal()" class="w-full py-3 rounded-xl bg-gradient-to-r from-orange-500 to-amber-500 text-zinc-950 text-sm font-black">
              Let's Keep Lifting!
            </button>
          </div>
        </div>
      `;
    }

    function closeModal() {
      document.getElementById('modalRoot').innerHTML = '';
    }

    /**
     * ============================================================================
     * 12. APP BOOTSTRAP
     * ============================================================================
     */
    window.addEventListener('DOMContentLoaded', () => {
      checkInviteUrlParam();
      renderApp();
      initFirebaseCloud(null, true);
    });
  </script>
</body>
</html>
